<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#bfeaff">
<title>切奶蛙 · 奶蛙小游戏</title>
<meta name="description" content="滑动切开飞来的奶蛙，连击翻倍，别切到坏奶炸弹！">
<link rel="icon" type="image/png" href="/assets/favicon-frog.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:title" content="切奶蛙 · 奶蛙小游戏"><meta property="og:description" content="滑动切开飞来的奶蛙，连击翻倍！"><meta property="og:image" content="https://price-naiwa.onrender.com/assets/og.png">
<link rel="stylesheet" href="/style.css?v=cut2">
</head>
<body class="game">
<div class="nw-game">
  <div id="nw-top"></div><div id="nw-hud"></div>
  <main class="nw-stage" id="box"><canvas class="nw-canvas" id="cv"></canvas></main>
  <p class="nw-hint">手指/鼠标滑动切开奶蛙 · 连击加分 · 别切黑色坏奶</p>
</div>
<script src="/assets/frog.js?v=cut2"></script><script src="/assets/nw.js?v=cut2"></script>
<script>
(function () {
  var F = NaiwaFrog, box = document.getElementById('box'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var W = 360, H = 600, view = { s: 1 };
  var COLS = ['#F7C32B', '#8FD14F', '#FF9F43', '#FF7BAC', '#5CC8F2', '#B28DFF', '#3ED3B5'];
  var MOODS = ['neutral', 'laugh', 'wow', 'laugh', 'neutral', 'laugh', 'wow'];
  var sprBall = COLS.map(function (c, i) { return F.pieceSprite({ shape: 'ball', color: c, mood: MOODS[i] }, 96, 96); });
  var sprBomb = F.pieceSprite({ shape: 'ball', color: '#FF6B5E', mood: 'wow' }, 96, 96);
  var sprHalfL = COLS.map(function (c) { return F.spritePng(F.slicePath({ color: c, part: 'L' }), 96, 96); });
  var sprHalfR = COLS.map(function (c) { return F.spritePng(F.slicePath({ color: c, part: 'R' }), 96, 96); });
  var sprHalfT = COLS.map(function (c) { return F.spritePng(F.slicePath({ color: c, part: 'T' }), 96, 96); });
  var sprHalfB = COLS.map(function (c) { return F.spritePng(F.slicePath({ color: c, part: 'B' }), 96, 96); });
  var fx = new NW.FX();
  var G = NW.mount({
    key: 'cut', title: '切奶蛙', scoreLabel: '分数', extraCard: '连击',
    rules: '滑动切开抛起的奶蛙。连击越高分越多（最高 ×5）。漏切会掉心，切到深色坏奶直接炸。波次越来越快、越来越多。',
    onStart: reset
  });

  var ents, halves, trail, lives, combo, comboT, maxCombo, difficulty, spawnAcc, t0, dead, flash, bladeAng, particles;
  var GRAV = 980;

  function reset() {
    ents = []; halves = []; trail = []; particles = [];
    lives = 3; combo = 0; comboT = 0; maxCombo = 0; difficulty = 1; spawnAcc = 0.2; t0 = 0; dead = false; flash = 0; bladeAng = 0;
    G.setScore(0, false); G.setExtra('●●●');
    setTimeout(spawnWave, 280);
  }

  function setLives() {
    var s = ''; for (var i = 0; i < 3; i++) s += i < lives ? '●' : '○';
    G.setExtra(combo > 1 ? '×' + Math.min(5, 1 + Math.floor((combo - 1) / 2)) + '  ' + s : s);
  }

  function spawnOne(delay) {
    setTimeout(function () {
      if (!G.running || dead) return;
      var bombChance = Math.min(0.22, 0.05 + difficulty * 0.025);
      var isBomb = Math.random() < bombChance && t0 > 4;
      var ci = (Math.random() * COLS.length) | 0;
      var x = 40 + Math.random() * (W - 80);
      var side = Math.random() < 0.5 ? -1 : 1;
      ents.push({
        x: x, y: H + 30 + Math.random() * 40,
        vx: side * (40 + Math.random() * 90) * (0.6 + Math.random()),
        vy: -(520 + Math.random() * 220 + difficulty * 18),
        r: isBomb ? 34 : (28 + Math.random() * 10),
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 6,
        ci: ci, bomb: isBomb, alive: true, sliced: false, born: 0
      });
    }, delay || 0);
  }

  function spawnWave() {
    if (!G.running || dead) return;
    var n = Math.min(7, 2 + Math.floor(difficulty) + ((Math.random() * 2) | 0));
    for (var i = 0; i < n; i++) spawnOne(i * (90 + Math.random() * 70));
  }

  function loseLife(why) {
    if (dead) return;
    lives--; combo = 0; comboT = 0; setLives();
    NW.sfx.bad(); NW.vib([18, 40, 18]); flash = 0.35;
    fx.text(W / 2, 160, why, { size: 26, color: '#ff4a4a', life: 0.9 });
    NW.shake && NW.shake(box, 10, 280);
    if (lives <= 0) {
      dead = true;
      NW.sfx.lose();
      setTimeout(function () { G.over('切开了 ' + G.score + ' 分 · 最高连击 ' + maxCombo); }, 600);
    }
  }

  function sliceEntity(e, ang) {
    if (!e.alive || e.sliced) return;
    e.sliced = true; e.alive = false;
    if (e.bomb) {
      flash = 0.55; NW.sfx.lose(); NW.vib(60);
      fx.burst(e.x, e.y, { count: 36, speed: 340, colors: ['#ff4a4a', '#333', '#fff', '#F7C32B'], size: 8 });
      for (var i = ents.length - 1; i >= 0; i--) if (!ents[i].sliced) ents[i].alive = false;
      loseLife('切到坏奶！');
      return;
    }
    combo++; comboT = 0.95; if (combo > maxCombo) maxCombo = combo;
    var mult = Math.min(5, 1 + Math.floor((combo - 1) / 2));
    var pts = (10 + ((e.r - 28) | 0)) * mult;
    G.setScore(G.score + pts); setLives();
    NW.sfx.pop(Math.min(combo, 9)); NW.vib(8 + Math.min(12, combo));
    if (combo >= 3) NW.sfx.combo(Math.min(6, Math.floor(combo / 2)));
    if (combo === 5 || combo === 10 || combo === 15) NW.sfx.perfect();

    bladeAng = ang || 0;
    var nx = Math.cos(bladeAng), ny = Math.sin(bladeAng);
    // 近似水平切用 T/B，竖直切用 L/R
    var vert = Math.abs(Math.cos(bladeAng)) >= Math.abs(Math.sin(bladeAng));
    halves.push({
      x: e.x - nx * 8, y: e.y - ny * 8, vx: e.vx - nx * 140 - 30, vy: e.vy - 90, rot: e.rot, vr: -7,
      ci: e.ci, life: 1.15, s: e.r / 40, part: vert ? 'L' : 'T'
    });
    halves.push({
      x: e.x + nx * 8, y: e.y + ny * 8, vx: e.vx + nx * 140 + 30, vy: e.vy - 50, rot: e.rot, vr: 7,
      ci: e.ci, life: 1.15, s: e.r / 40, part: vert ? 'R' : 'B'
    });
    fx.burst(e.x, e.y, { count: 14 + combo, speed: 240, colors: [COLS[e.ci], '#fff', '#FFD23F'], size: 6 });
    fx.text(e.x, e.y - e.r - 10, '+' + pts, { size: 18 + Math.min(12, combo), color: mult > 1 ? '#ff4a2a' : '#e8a000' });
    if (combo >= 3) fx.text(W / 2, 120, '连击 ×' + combo, { size: 30, color: '#ff8a00', life: 0.7 });
    // juice particles
    for (var p = 0; p < 10; p++) {
      var a = Math.random() * 6.28;
      particles.push({ x: e.x, y: e.y, vx: Math.cos(a) * (80 + Math.random() * 160), vy: Math.sin(a) * (80 + Math.random() * 160) - 60, life: 0.45 + Math.random() * 0.3, c: COLS[e.ci], s: 3 + Math.random() * 4 });
    }
  }

  function resize() { NW.fit(cv, box, W / H, 480); view.s = cv.width / W; }
  window.addEventListener('resize', resize); resize();

  var drawing = false, lastP = null;
  function pt(e) {
    var r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) / view.s, y: (e.clientY - r.top) / view.s };
  }
  function onDown(e) {
    if (e.target && e.target.closest && e.target.closest('.nw-modal,.nw-top,button,a')) return;
    if (!G.running) return;
    drawing = true; lastP = pt(e);
    trail.push({ x: lastP.x, y: lastP.y, life: 0.28 });
    try { box.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function onMove(e) {
    if (!drawing || !G.running || dead) return;
    var p = pt(e);
    if (!lastP) { lastP = p; return; }
    var dx = p.x - lastP.x, dy = p.y - lastP.y, dist = Math.hypot(dx, dy);
    if (dist < 2) return;
    var steps = Math.max(1, Math.min(8, (dist / 8) | 0));
    for (var s = 1; s <= steps; s++) {
      var t = s / steps;
      var x = lastP.x + dx * t, y = lastP.y + dy * t;
      trail.push({ x: x, y: y, life: 0.3 });
      // hit test
      for (var i = 0; i < ents.length; i++) {
        var en = ents[i];
        if (!en.alive || en.sliced) continue;
        if (Math.hypot(en.x - x, en.y - y) < en.r + 8) {
          sliceEntity(en, Math.atan2(dy, dx));
        }
      }
    }
    lastP = p;
  }
  function onUp() { drawing = false; lastP = null; }
  box.addEventListener('pointerdown', onDown);
  box.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (flash > 0) flash -= dt;
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) { combo = 0; setLives(); } }

    if (G.running && !dead) {
      t0 += dt; difficulty = 1 + t0 / 28;
      spawnAcc += dt;
      var interval = Math.max(0.85, 2.1 - difficulty * 0.18);
      if (spawnAcc >= interval) { spawnAcc = 0; spawnWave(); }

      for (var i = ents.length - 1; i >= 0; i--) {
        var e = ents[i];
        e.born = Math.min(1, e.born + dt * 5);
        e.vy += GRAV * dt; e.x += e.vx * dt; e.y += e.vy * dt; e.rot += e.vr * dt;
        // slight air drag
        e.vx *= 1 - dt * 0.15;
        if (e.y > H + 80 && e.alive && !e.sliced) {
          e.alive = false;
          if (!e.bomb) loseLife('漏切了');
          ents.splice(i, 1);
        } else if (!e.alive && e.y > H + 100) ents.splice(i, 1);
        else if (e.sliced) ents.splice(i, 1);
      }
    }

    for (var h = halves.length - 1; h >= 0; h--) {
      var ha = halves[h];
      ha.vy += GRAV * dt; ha.x += ha.vx * dt; ha.y += ha.vy * dt; ha.rot += ha.vr * dt; ha.life -= dt;
      if (ha.life <= 0 || ha.y > H + 60) halves.splice(h, 1);
    }
    for (var tr = trail.length - 1; tr >= 0; tr--) { trail[tr].life -= dt; if (trail[tr].life <= 0) trail.splice(tr, 1); }
    for (var p = particles.length - 1; p >= 0; p--) {
      var q = particles[p]; q.vy += 600 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt;
      if (q.life <= 0) particles.splice(p, 1);
    }

    draw();
    fx.draw(ctx);
    requestAnimationFrame(frame);
  }

  function roundRect(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  function draw() {
    var c = ctx;
    c.setTransform(view.s, 0, 0, view.s, 0, 0);
    var g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#b4e4ff'); g.addColorStop(0.5, '#eef9ff'); g.addColorStop(1, '#dff3b0');
    c.fillStyle = g; c.fillRect(0, 0, W, H);

    // soft dojo wood floor hint
    c.fillStyle = 'rgba(200,160,80,.18)';
    c.fillRect(0, H - 70, W, 70);
    c.fillStyle = 'rgba(180,130,50,.12)';
    for (var i = 0; i < 6; i++) c.fillRect(0, H - 70 + i * 12, W, 2);

    // decorative lanterns
    [[40, 36], [W - 40, 42]].forEach(function (p, i) {
      c.fillStyle = i ? 'rgba(255,120,100,.55)' : 'rgba(255,200,80,.55)';
      roundRect(c, p[0] - 12, p[1], 24, 32, 8); c.fill();
      c.strokeStyle = 'rgba(120,60,20,.35)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(p[0], 8); c.lineTo(p[0], p[1]); c.stroke();
    });

    // halves
    halves.forEach(function (ha) {
      c.save(); c.globalAlpha = Math.max(0, ha.life); c.translate(ha.x, ha.y); c.rotate(ha.rot * 0.35);
      var pack = { L: sprHalfL, R: sprHalfR, T: sprHalfT, B: sprHalfB }[ha.part] || sprHalfL;
      var im = pack[ha.ci] || sprBall[ha.ci];
      var sz = 88 * ha.s;
      if (im && im.width) c.drawImage(im, -sz / 2, -sz / 2, sz, sz);
      else { c.fillStyle = COLS[ha.ci]; c.beginPath(); c.arc(0, 0, 30 * ha.s, 0, 6.28); c.fill(); }
      c.restore();
    });

    // living frogs
    ents.forEach(function (e) {
      if (!e.alive && e.sliced) return;
      c.save(); c.translate(e.x, e.y); c.rotate(e.rot);
      var sc = (0.7 + 0.3 * e.born) * (e.bomb ? 1 : 1);
      c.scale(sc, sc);
      // soft shadow under
      c.fillStyle = 'rgba(0,0,0,.12)'; c.beginPath(); c.ellipse(0, e.r * 0.85, e.r * 0.7, e.r * 0.22, 0, 0, 6.28); c.fill();
      var im = e.bomb ? sprBomb : sprBall[e.ci];
      var sz = e.r * 2.15;
      if (im && im.width) c.drawImage(im, -sz / 2, -sz / 2, sz, sz);
      else { c.fillStyle = e.bomb ? '#333' : COLS[e.ci]; c.beginPath(); c.arc(0, 0, e.r, 0, 6.28); c.fill(); }
      if (e.bomb) {
        // fuse
        c.strokeStyle = '#333'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, -e.r + 4); c.quadraticCurveTo(10, -e.r - 14, 16, -e.r - 8); c.stroke();
        c.fillStyle = '#ff8a00'; c.beginPath(); c.arc(16, -e.r - 8, 4 + Math.sin(t0 * 20) * 1.5, 0, 6.28); c.fill();
        c.fillStyle = 'rgba(0,0,0,.35)'; c.font = 'bold 14px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText('坏', 0, 4);
      }
      c.restore();
    });

    // juice particles
    particles.forEach(function (q) {
      c.globalAlpha = Math.max(0, q.life * 2); c.fillStyle = q.c;
      c.beginPath(); c.arc(q.x, q.y, q.s, 0, 6.28); c.fill(); c.globalAlpha = 1;
    });

    // blade trail
    if (trail.length > 1) {
      c.lineCap = 'round'; c.lineJoin = 'round';
      for (var i = 1; i < trail.length; i++) {
        var a = trail[i - 1], b = trail[i];
        var life = Math.min(a.life, b.life);
        c.strokeStyle = 'rgba(255,255,255,' + (life * 2.2) + ')';
        c.lineWidth = 2 + life * 10;
        c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
        c.strokeStyle = 'rgba(255,210,60,' + (life * 1.4) + ')';
        c.lineWidth = 1 + life * 4;
        c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
      }
    }

    if (flash > 0) {
      c.fillStyle = 'rgba(255,60,60,' + (flash * 0.45) + ')';
      c.fillRect(0, 0, W, H);
    }

    if (G.running && combo >= 2) {
      c.fillStyle = 'rgba(255,255,255,.75)'; roundRect(c, W / 2 - 54, 10, 108, 28, 14); c.fill();
      c.fillStyle = '#ff6a00'; c.font = 'bold 14px system-ui,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('连击 ×' + combo, W / 2, 24);
    }
  }

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
