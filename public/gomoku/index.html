<script>

function btnAt(x, y) { if (y < BY2 || y > BY2 + 44) return null; for (var i = 0; i < BTNS.length; i++) if (x >= BTNS[i].x && x <= BTNS[i].x + BTNS[i].w) return BTNS[i]; return null; }
S.on({
  down: function (x, y) {

  },
  move: function (x, y) { if (ghost) { ghost.x = x; ghost.y = y - 34; } },
  up: function (x, y) { if (!ghost) return; var p = snapPt(ghost.x, ghost.y); ghost = null; if (p && !b[p[1]][p[0]] && turn === ME && !over) { myMoves++; G.setExtra(myMoves); put(p[0], p[1], ME); } }
});
function undo() { if (thinking || over || hist.length < 2) { NW.sfx.bad(); return; } for (var i = 0; i < 2; i++) { var h = hist.pop(); b[h[1]][h[0]] = 0; } myMoves = Math.max(0, myMoves - 1); G.setExtra(myMoves); last = hist.length ? [hist[hist.length - 1][0], hist[hist.length - 1][1]] : null; turn = ME; NW.sfx.swap(); }

  c.strokeStyle = 'rgba(110,70,10,.6)'; c.lineWidth = 1; for (var i = 0; i < N; i++) { c.beginPath(); c.moveTo(px(0), py(i)); c.lineTo(px(N - 1), py(i)); c.stroke(); c.beginPath(); c.moveTo(px(i), py(0)); c.lineTo(px(i), py(N - 1)); c.stroke(); }
