<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#bfeaff">
<title>合成大奶蛙 · 奶蛙小游戏</title>
<meta name="description" content="同款奶蛙相撞升级，合出最大的金色奶蛙！奶蛙小游戏之合成大奶蛙。">
<link rel="icon" type="image/png" href="/assets/favicon-frog.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:title" content="合成大奶蛙 · 奶蛙小游戏"><meta property="og:description" content="同款奶蛙相撞升级，合出最大的金色奶蛙！奶蛙小游戏之合成大奶蛙。"><meta property="og:image" content="https://price-naiwa.onrender.com/assets/og.png">
<link rel="stylesheet" href="/style.css">
</head>
<body class="game">
<div class="nw-game">
  <div id="nw-top"></div><div id="nw-hud"></div>
  <main class="nw-stage" id="box"><canvas class="nw-canvas" id="cv"></canvas></main>
  <p class="nw-hint">按住左右拖动瞄准，松手投放 · 两个相同的会合成更大的</p>
</div>
<script src="/assets/frog.js"></script><script src="/assets/nw.js"></script>
<script>
(function () {
  var F = NaiwaFrog, box = document.getElementById('box'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var W = 360, H = 620, WALL = 10, FLOOR = H - 14, DANGER = 160, DROPY = 126;
  var R = [17, 23, 30, 38, 47, 57, 68, 80, 94];
  var COL = ['#FF7BAC', '#FF6B5E', '#B28DFF', '#FF9F43', '#5CC8F2', '#3ED3B5', '#8FD14F', '#FFB830', '#F7C32B'];
  var MOOD = ['neutral', 'wow', 'neutral', 'laugh', 'neutral', 'wow', 'laugh', 'neutral', 'laugh'];
  var spr = R.map(function (r, i) { var sz = r * 2 * 100 / 90; return F.sprite(F.ball({ color: COL[i], mood: MOOD[i], crown: i === 8 }), sz, sz); });
  var fx = new NW.FX(), view = { s: 1, dpr: 1 };
  var balls = [], cur = 0, nxt = 0, aimX = W / 2, canDrop = true, dropT = 0, dangerT = 0, shakeT = 0, shakeA = 0, uid = 0, chain = 0, chainT = 0, held = false, flash = 0, hitstop = 0;
  var G = NW.mount({ key: 'merge', title: '合成大奶蛙', rules: '拖动瞄准、松手投放。两个相同的奶蛙相撞会合成更大一号，合出金色皇冠奶蛙！别让它们堆过红线。', onStart: reset });
  function rnd(not) { var w = [.28, .24, .20, .16, .12], v; for (var t = 0; t < 6; t++) { var r = Math.random(), s = 0; v = 4; for (var i = 0; i < 5; i++) { s += w[i]; if (r < s) { v = i; break; } } if (v !== not) break; } return v; }
  function reset() { balls = []; fx.p = []; cur = rnd(); nxt = rnd(cur); canDrop = true; dangerT = 0; chain = 0; flash = 0; hitstop = 0; G.setScore(0, false); }
  function resize() { var o = NW.fit(cv, box, W / H, 520); view.dpr = o.dpr; view.s = cv.width / W; }
  window.addEventListener('resize', resize); resize();
  function pos(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
  function clampX(x) { var r = R[cur]; return Math.max(WALL + r, Math.min(W - WALL - r, x)); }
  cv.addEventListener('pointerdown', function (e) { held = true; cv.setPointerCapture(e.pointerId); aimX = clampX(pos(e).x); });
  cv.addEventListener('pointermove', function (e) { if (held) aimX = clampX(pos(e).x); });
  function release() { if (!held) return; held = false; if (!G.running || !canDrop) return; drop(); }
  cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', function () { held = false; });
  function drop() {
    balls.push({ id: ++uid, x: clampX(aimX), y: DROPY, vx: 0, vy: 130, r: R[cur], lv: cur, age: 0, sq: 0, sa: 0, grow: 1, pop: 0, rot: 0 });
    NW.sfx.drop(); cur = nxt; nxt = rnd(cur); canDrop = false; dropT = .36;
  }
  function addScore(n, x, y) { G.setScore(G.score + n); fx.text(x, y, '+' + n, { size: 22 + Math.min(14, chain * 3), color: chain > 1 ? '#ff4a2a' : '#e8a000' }); }
  function step(dt) {
    var i, j, a, b;
    for (i = 0; i < balls.length; i++) { a = balls[i]; a.vy += 2600 * dt; a.x += a.vx * dt; a.y += a.vy * dt; a.age += dt; a.sq *= Math.max(0, 1 - 9 * dt); if (a.pop > 0) a.pop = Math.max(0, a.pop - dt / .22);
      if (a.x < WALL + a.r) { a.x = WALL + a.r; if (a.vx < -55) { a.sq = Math.max(a.sq, Math.min(.3, -a.vx / 1500)); a.sa = 0; } a.vx = a.vx < -55 ? -a.vx * .45 : 0; }
      if (a.x > W - WALL - a.r) { a.x = W - WALL - a.r; if (a.vx > 55) { a.sq = Math.max(a.sq, Math.min(.3, a.vx / 1500)); a.sa = 0; } a.vx = a.vx > 55 ? -a.vx * .45 : 0; }
      if (a.y > FLOOR - a.r) { a.y = FLOOR - a.r; if (a.vy > 55) { a.sq = Math.max(a.sq, Math.min(.3, a.vy / 1500)); a.sa = Math.PI / 2; a.vy = -a.vy * .45; } else a.vy = 0; a.vx *= .955; }
    }
    var merged = [];
    for (var it = 0; it < 3; it++) for (i = 0; i < balls.length; i++) for (j = i + 1; j < balls.length; j++) {
      a = balls[i]; b = balls[j]; if (a.dead || b.dead) continue;
      var dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r, d2 = dx * dx + dy * dy;
      if (d2 >= rr * rr) continue; var d = Math.sqrt(d2) || .01;
      if (a.lv === b.lv && !a.dead && !b.dead && (a.age > .04 && b.age > .04)) { a.dead = b.dead = true; merged.push([a, b]); continue; }
      var nx = dx / d, ny = dy / d, ov = rr - d, ma = a.r * a.r, mb = b.r * b.r, tm = ma + mb;
      a.x -= nx * ov * mb / tm; a.y -= ny * ov * mb / tm; b.x += nx * ov * ma / tm; b.y += ny * ov * ma / tm;
      var rvx = b.vx - a.vx, rvy = b.vy - a.vy, vn = rvx * nx + rvy * ny;
      if (vn < 0 && it === 0) { var e = -vn < 55 ? 0 : .38, imp = -(1 + e) * vn / (1 / ma + 1 / mb); a.vx -= imp * nx / ma; a.vy -= imp * ny / ma; b.vx += imp * nx / mb; b.vy += imp * ny / mb; if (vn < -55) { var k = Math.min(.3, -vn / 1500); a.sq = Math.max(a.sq, k); b.sq = Math.max(b.sq, k); a.sa = b.sa = Math.atan2(ny, nx); }
        var tx = -ny, ty = nx, tv = (b.vx - a.vx) * tx + (b.vy - a.vy) * ty; a.vx += tx * tv * .0225; a.vy += ty * tv * .0225; b.vx -= tx * tv * .0225; b.vy -= ty * tv * .0225; }
    }
    if (merged.length) {
      merged.forEach(function (m) {
        var a = m[0], b = m[1], x = (a.x + b.x) / 2, y = (a.y + b.y) / 2, lv = a.lv;
        chain++; chainT = 1.1;
        if (lv >= 8) { addScore(1000, x, y); fx.burst(x, y, { count: 60, speed: 520, size: 12, life: 1.1 }); NW.sfx.win(); shakeT = .4; shakeA = 10; flash = 1.4; hitstop = .13; NW.vib(70); }
        else {
          var n = { id: ++uid, x: x, y: y, vx: (a.vx + b.vx) / 2, vy: -80, r: R[lv + 1], lv: lv + 1, age: .05, sq: 0, sa: 0, grow: 1, pop: 1, rot: 0 };
          balls.push(n); addScore((lv + 1) * (lv + 2) * 5 * Math.max(1, chain), x, y - R[lv + 1] * .5);
          fx.burst(x, y, { count: 8 + 2 * (lv + 1), speed: 140 + 22 * (lv + 1), colors: [COL[lv + 1], '#fff', '#FFD23F'], size: 6 + lv });
          NW.sfx.merge(lv); NW.vib(6 + lv + 1); flash = Math.max(flash, lv + 1 === 8 ? 1 : .32);
          if (lv + 1 === 8) { fx.text(W / 2, H * .35, '皇冠奶蛙！', { size: 38, color: '#ff9f00', life: 1.4 }); shakeT = .3; shakeA = 8; NW.sfx.win(); hitstop = .13; }
          else if (chain > 1) { fx.text(x, y - R[lv + 1] - 14, '连锁 ×' + chain, { size: 24, color: '#ff4a2a', life: 1 }); NW.sfx.combo(chain); }
        }
      });
      balls = balls.filter(function (q) { return !q.dead; });
    }
  }
  var last = performance.now();
  function frame(t) {
    var dt = Math.min(.033, (t - last) / 1000); last = t;
    if (G.running) {
      if (hitstop > 0) hitstop -= dt; else for (var k = 0; k < 3; k++) step(dt / 3);
      if (dropT > 0) { dropT -= dt; if (dropT <= 0) canDrop = true; }
      if (chainT > 0) { chainT -= dt; if (chainT <= 0) chain = 0; }
      var over = false; balls.forEach(function (b) { if (b.age > 1 && b.y - b.r < DANGER && Math.hypot(b.vx, b.vy) < 140) over = true; });
      dangerT = over ? dangerT + dt : Math.max(0, dangerT - dt * 2);
      if (dangerT > 1.5) { shakeT = .5; shakeA = 12; fx.burst(W / 2, DANGER, { count: 30, colors: ['#ff5a5a', '#fff'] }); G.over('堆到顶了！合出的最大是第 ' + (balls.reduce(function (m, b) { return Math.max(m, b.lv); }, 0) + 1) + ' 级'); }
    }
    if (flash > 0) flash = Math.max(0, flash - 2.2 * dt); fx.update(dt); draw(t);
    requestAnimationFrame(frame);
  }
  function drawBall(c, b, x, y, sc) {
    var s = spr[b.lv], sz = s.__w, k = b.sq || 0, pp = 1 + .28 * (b.pop || 0);
    c.save(); c.translate(x, y); c.scale(sc * pp, sc * pp); c.rotate(b.sa || 0); c.scale(1 - k, 1 + .85 * k); c.rotate(-(b.sa || 0)); c.drawImage(s, -sz * .5, -sz * .52, sz, sz); c.restore();
  }
  function draw(t) {
    var c = ctx; c.setTransform(view.s, 0, 0, view.s, 0, 0); c.clearRect(0, 0, W, H);
    c.save(); if (shakeT > 0) { shakeT -= .016; c.translate((Math.random() - .5) * shakeA * shakeT * 2, (Math.random() - .5) * shakeA * shakeT * 2); }
    // 罐子背景
    var g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,246,200,.85)');
    c.fillStyle = g; rr(c, 0, 0, W, H, 26); c.fill();
    c.strokeStyle = '#fff'; c.lineWidth = 6; rr(c, 3, 3, W - 6, H - 6, 24); c.stroke();
    // 危险线
    var flash = dangerT > 0 ? (Math.sin(t / 90) > 0 ? 1 : .35) : .55;
    c.strokeStyle = 'rgba(255,90,90,' + flash + ')'; c.lineWidth = 3; c.setLineDash([10, 8]); c.beginPath(); c.moveTo(WALL, DANGER); c.lineTo(W - WALL, DANGER); c.stroke(); c.setLineDash([]);
    // 地面
    var fg = c.createLinearGradient(0, FLOOR, 0, H); fg.addColorStop(0, '#a9e566'); fg.addColorStop(1, '#6bb82e'); c.fillStyle = fg; rr(c, WALL - 4, FLOOR, W - WALL * 2 + 8, H - FLOOR - 6, 12); c.fill();
    // 瞄准
    if (G.running || true) {
      var ax = clampX(aimX);
      if (canDrop && G.running) {
        c.strokeStyle = 'rgba(120,90,0,.28)'; c.lineWidth = 2; c.setLineDash([4, 7]); c.beginPath(); c.moveTo(ax, DROPY + R[cur]); c.lineTo(ax, FLOOR); c.stroke(); c.setLineDash([]);
        drawBall(c, { lv: cur, r: R[cur] }, ax, DROPY + Math.sin(t / 300) * 2, 1);
      }
    }
    for (var i = 0; i < balls.length; i++) { var b = balls[i]; c.fillStyle = 'rgba(90,60,0,.1)'; c.beginPath(); c.ellipse(b.x, Math.min(FLOOR + 2, b.y + b.r * .96), b.r * .8, b.r * .1, 0, 0, 6.3); c.fill(); }
    for (i = 0; i < balls.length; i++) { b = balls[i]; drawBall(c, b, b.x, b.y, b.grow); }
    // 下一个
    c.fillStyle = 'rgba(255,255,255,.85)'; rr(c, W - 78, 12, 64, 74, 16); c.fill();
    c.fillStyle = '#8a7440'; c.font = '800 11px system-ui,-apple-system,"PingFang SC",sans-serif'; c.textAlign = 'center'; c.fillText('下一个', W - 46, 30);
    var sn = spr[nxt], k = 34 / R[nxt]; c.save(); c.translate(W - 46, 60); c.scale(Math.min(1, k) , Math.min(1, k)); c.drawImage(sn, -sn.__w * .5, -sn.__w * .52, sn.__w, sn.__w); c.restore();
    fx.draw(c); c.restore();
    if (flash > 0) { c.globalAlpha = Math.min(1, flash * .35); c.fillStyle = '#fff'; c.fillRect(0, 0, W, H); c.globalAlpha = 1; }
  }
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  requestAnimationFrame(frame);
})();
</script>
