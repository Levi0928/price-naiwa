<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#bfeaff">
<title>合成大奶蛙 · 奶蛙小游戏</title>
<meta name="description" content="同款奶蛙相撞升级，合出最大的金色奶蛙！奶蛙小游戏之合成大奶蛙。">
<link rel="icon" type="image/png" href="/assets/favicon-frog.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:title" content="合成大奶蛙 · 奶蛙小游戏"><meta property="og:description" content="同款奶蛙相撞升级，合出最大的金色奶蛙！"><meta property="og:image" content="https://price-naiwa.onrender.com/assets/og.png">
<link rel="stylesheet" href="/style.css?v=model3">
<style>
.jar-bar{display:flex;gap:6px;justify-content:center;align-items:flex-end;padding:8px 10px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.jar-bar .t{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:28px}
.jar-bar .t img{width:26px;height:26px;object-fit:contain;filter:drop-shadow(0 1px 0 rgba(0,0,0,.08))}
.jar-bar .t span{font-size:9px;font-weight:800;color:#948876}
.jar-bar .t.on span{color:#6a4400}
.revive-mask{position:fixed;inset:0;z-index:40;background:rgba(26,22,18,.45);display:none;align-items:center;justify-content:center;padding:20px}
.revive-mask.show{display:flex}
.revive-box{background:linear-gradient(180deg,#fffdf2,#fff3c4);border-radius:24px;padding:22px 20px;max-width:320px;width:100%;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.25),0 0 0 3px #fff}
.revive-box h3{margin:0 0 8px;font-size:1.25rem;color:#6a4400}
.revive-box p{margin:0 0 16px;color:#4D453B;font-weight:600;line-height:1.5}
.revive-box .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body class="game">
<div class="nw-game">
  <div id="nw-top"></div><div id="nw-hud"></div>
  <div class="jar-bar" id="chain" aria-label="合成进化链"></div>
  <main class="nw-stage" id="box"><canvas class="nw-canvas" id="cv"></canvas></main>
  <p class="nw-hint">拖动/←→瞄准 · 松手/空格投放 · R重开 · 相同合成 · 每 2000 分复活币</p>
</div>
<div class="revive-mask" id="revive"><div class="revive-box">
  <h3>还能再救一下</h3>
  <p id="rv-txt">清掉警戒线上方的奶蛙，继续这一局。</p>
  <div class="row"><button class="btn green" id="rv-yes">用 1 枚复活币</button><button class="btn white" id="rv-no">结束本局</button></div>
</div></div>
<script src="/assets/frog.js?v=model3"></script><script src="/assets/nw.js?v=model3"></script>
<script>
(function () {
  var F = NaiwaFrog, box = document.getElementById('box'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var W = 360, H = 620, WALL = 10, FLOOR = H - 14, DANGER = 142, DROPY = 74;
  // 11 tiers ~ milkyfrog teardown radii
  var R = [17, 23, 31, 39, 48, 58, 69, 81, 94, 108, 124];
  var COL = ['#FF7BAC', '#FF6B5E', '#B28DFF', '#FF9F43', '#5CC8F2', '#3ED3B5', '#8FD14F', '#FFB830', '#F7C32B', '#FFE27A', '#FFD83D'];
  var MOOD = ['neutral', 'wow', 'neutral', 'laugh', 'neutral', 'wow', 'laugh', 'neutral', 'laugh', 'wow', 'laugh'];
  var NAMES = ['粉豆','赤豆','紫豆','橙豆','蓝豆','青豆','绿豆','金豆','金蛙','大奶蛙','皇冠奶蛙'];
  var spr = R.map(function (r, i) { var sz = Math.max(48, Math.min(160, r * 2.2)); return F.pieceSprite({ shape: 'ball', color: COL[i], mood: MOOD[i] }, sz, sz); });
  var fx = new NW.FX(), view = { s: 1, dpr: 1 };
  var balls = [], cur = 0, nxt = 0, aimX = W / 2, canDrop = true, dropT = 0, dangerT = 0, shakeT = 0, shakeA = 0, uid = 0, chain = 0, chainT = 0, held = false, flash = 0, hitstop = 0;
  var coins = 0, coinBank = 0, paused = false, maxSeen = 0;
  var G = NW.mount({ key: 'merge', title: '合成大奶蛙', extraCard: '复活币', rules: '拖动瞄准、松手投放。两个相同奶蛙相撞合成更大一号（共 11 级）。越过红线且停住约 1.5 秒判负；每 2000 分送 1 枚复活币，可清掉线以上的球继续。合出皇冠奶蛙！', onStart: reset });
  function rnd(not) { var w = [.28, .24, .20, .16, .12], v; for (var t = 0; t < 6; t++) { var r = Math.random(), s = 0; v = 4; for (var i = 0; i < 5; i++) { s += w[i]; if (r < s) { v = i; break; } } if (v !== not) break; } return v; }

  function reset() {

  });

  }
  function addScore(n, x, y) {

    var gained = Math.floor(G.score / 2000) - Math.floor(coinBank / 2000);
    if (gained > 0) { coins += gained; coinBank = G.score; G.setExtra(coins); NW.toast('获得复活币 ×' + gained); NW.sfx.win(); }

  }
  function offerRevive() {

    document.getElementById('revive').classList.add('show');

  document.getElementById('rv-yes').onclick = function () { if (coins > 0) doRevive(); };
  document.getElementById('rv-no').onclick = function () {
    document.getElementById('revive').classList.remove('show'); paused = false;
    G.over('堆到顶了！合出的最大是第 ' + (balls.reduce(function (m, b) { return Math.max(m, b.lv); }, 0) + 1) + ' 级 · ' + NAMES[Math.min(10, balls.reduce(function (m, b) { return Math.max(m, b.lv); }, 0))]);
  };
  function step(dt) {

    for (i = 0; i < balls.length; i++) { a = balls[i]; a.vy += 2600 * dt; a.x += a.vx * dt; a.y += a.vy * dt; a.age += dt; a.sq *= Math.max(0, 1 - 9 * dt); if (a.pop > 0) a.pop = Math.max(0, a.pop - dt / .22);
      if (a.x < WALL + a.r) { a.x = WALL + a.r; if (a.vx < -55) { a.sq = Math.max(a.sq, Math.min(.3, -a.vx / 1500)); a.sa = 0; } a.vx = a.vx < -55 ? -a.vx * .45 : 0; }
      if (a.x > W - WALL - a.r) { a.x = W - WALL - a.r; if (a.vx > 55) { a.sq = Math.max(a.sq, Math.min(.3, a.vx / 1500)); a.sa = 0; } a.vx = a.vx > 55 ? -a.vx * .45 : 0; }
      if (a.y > FLOOR - a.r) { a.y = FLOOR - a.r; if (a.vy > 55) { a.sq = Math.max(a.sq, Math.min(.3, a.vy / 1500)); a.sa = Math.PI / 2; a.vy = -a.vy * .45; } else a.vy = 0; a.vx *= .955; }
    }

      a = balls[i]; b = balls[j]; if (a.dead || b.dead) continue;
      var dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r, d2 = dx * dx + dy * dy;
      if (d2 >= rr * rr) continue; var d = Math.sqrt(d2) || .01;
      if (a.lv === b.lv && !a.dead && !b.dead && (a.age > .04 && b.age > .04)) { a.dead = b.dead = true; merged.push([a, b]); continue; }
      var nx = dx / d, ny = dy / d, ov = rr - d, ma = a.r * a.r, mb = b.r * b.r, tm = ma + mb;
      a.x -= nx * ov * mb / tm; a.y -= ny * ov * mb / tm; b.x += nx * ov * ma / tm; b.y += ny * ov * ma / tm;
      var rvx = b.vx - a.vx, rvy = b.vy - a.vy, vn = rvx * nx + rvy * ny;
      if (vn < 0 && it === 0) { var e = -vn < 55 ? 0 : .38, imp = -(1 + e) * vn / (1 / ma + 1 / mb); a.vx -= imp * nx / ma; a.vy -= imp * ny / ma; b.vx += imp * nx / mb; b.vy += imp * ny / mb; if (vn < -55) { var k = Math.min(.3, -vn / 1500); a.sq = Math.max(a.sq, k); b.sq = Math.max(b.sq, k); a.sa = b.sa = Math.atan2(ny, nx); }
        var tx = -ny, ty = nx, tv = (b.vx - a.vx) * tx + (b.vy - a.vy) * ty; a.vx += tx * tv * .0225; a.vy += ty * tv * .0225; b.vx -= tx * tv * .0225; b.vy -= ty * tv * .0225; }

      merged.forEach(function (m) {
        var a = m[0], b = m[1], x = (a.x + b.x) / 2, y = (a.y + b.y) / 2, lv = a.lv;
        chain++; chainT = 1.1; maxSeen = Math.max(maxSeen, Math.min(10, lv + 1)); paintChain();
        if (lv >= 10) {
          addScore(500, x, y); coins += 1; G.setExtra(coins); coinBank = Math.max(coinBank, G.score);

          fx.text(W / 2, H * .32, '双冠对撞！+复活币', { size: 28, color: '#ff4a2a', life: 1.3 });
        } else {
          var n = { id: ++uid, x: x, y: y, vx: (a.vx + b.vx) / 2, vy: -80, r: R[lv + 1], lv: lv + 1, age: .05, sq: 0, sa: 0, grow: 1, pop: 1, rot: 0 };
          balls.push(n); addScore((lv + 1) * (lv + 2) / 2, x, y - R[lv + 1] * .5);
          fx.burst(x, y, { count: 12 + 3 * (lv + 1), speed: 160 + 26 * (lv + 1), colors: [COL[lv + 1], '#fff', '#FFD23F', '#FFE27A'], size: 6 + lv * .5 });
          if (fx.ring) fx.ring(x, y, { maxR: 40 + lv * 8, life: 0.35, color: COL[lv + 1] });
          if (fx.ripple) fx.ripple(x, y, { maxR: 28 + lv * 4, life: 0.28 });
          NW.sfx.merge(lv); NW.vib(6 + lv + 1); flash = Math.max(flash, lv + 1 === 10 ? 1 : .32); hitstop = Math.max(hitstop, lv >= 6 ? 0.07 : 0.03);

          else if (chain > 1) { fx.text(x, y - R[lv + 1] - 14, '连锁 ×' + chain, { size: 24, color: '#ff4a2a', life: 1 }); NW.sfx.combo(chain); }
        }

  }
  var last = performance.now();
  function frame(t) {
    var dt = Math.min(.033, (t - last) / 1000); last = t;
    if (G.running && !paused) {
      if (keys.left) aimX = clampX(aimX - 220 * dt);
      if (keys.right) aimX = clampX(aimX + 220 * dt);
      if (hitstop > 0) hitstop -= dt; else for (var k = 0; k < 3; k++) step(dt / 3); /* 3 substeps × 6 collision iters */

      if (chainT > 0) { chainT -= dt; if (chainT <= 0) chain = 0; }
      var over = false; balls.forEach(function (b) { if (b.age > 1 && b.y - b.r < DANGER && Math.hypot(b.vx, b.vy) < 140) over = true; });
      dangerT = over ? dangerT + dt : Math.max(0, dangerT - dt * 2);
      if (dangerT > 1.0 && dangerT <= 1.5 && Math.floor(dangerT * 10) !== Math.floor((dangerT - dt) * 10)) { try { NW.sfx.bad(); } catch (e) {} }
      if (dangerT > 1.5) {
        if (coins > 0) { dangerT = 1.4; offerRevive(); }
        else { shakeT = .5; shakeA = 12; fx.burst(W / 2, DANGER, { count: 30, colors: ['#ff5a5a', '#fff'] }); G.over('堆到顶了！合出的最大是第 ' + (balls.reduce(function (m, b) { return Math.max(m, b.lv); }, 0) + 1) + ' 级'); }
      }
    }
    if (flash > 0) flash = Math.max(0, flash - 2.2 * dt); fx.update(dt); draw(t);
    requestAnimationFrame(frame);
  }
  function drawBall(c, b, x, y, sc) {
    var s = spr[b.lv], sz = s.__w, k = b.sq || 0, pp = 1 + .28 * (b.pop || 0);
    c.save(); c.translate(x, y); c.scale(sc * pp, sc * pp); c.rotate(b.sa || 0); c.scale(1 - k, 1 + .85 * k); c.rotate(-(b.sa || 0));
    c.fillStyle = 'rgba(70,45,0,.16)'; c.beginPath(); c.ellipse(2, sz * .38, sz * .34, sz * .1, 0, 0, 6.3); c.fill();
    c.drawImage(s, -sz * .5, -sz * .5, sz, sz);
    c.restore();
  }
  function draw(t) {
    var c = ctx; c.setTransform(view.s, 0, 0, view.s, 0, 0); c.clearRect(0, 0, W, H);
    c.save(); if (shakeT > 0) { shakeT -= .016; c.translate((Math.random() - .5) * shakeA * shakeT * 2, (Math.random() - .5) * shakeA * shakeT * 2); }
    // jar glass
    var g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#fff0d4');
    c.fillStyle = g; rr(c, 0, 0, W, H, 26); c.fill();
    c.fillStyle = 'rgba(255,255,255,.55)'; rr(c, 8, 8, W - 16, H - 16, 22); c.fill();
    // thick jar rim

    c.strokeStyle = 'rgba(255,255,255,.65)'; c.lineWidth = 2; rr(c, 10, 10, W - 20, H - 20, 20); c.stroke();
    // side glass sheen

    var flashL = dangerT > 0 ? (Math.sin(t / 90) > 0 ? 1 : .35) : .55;
    c.strokeStyle = 'rgba(255,90,90,' + flashL + ')'; c.lineWidth = 3; c.setLineDash([10, 8]); c.beginPath(); c.moveTo(WALL, DANGER); c.lineTo(W - WALL, DANGER); c.stroke(); c.setLineDash([]);
    c.fillStyle = 'rgba(255,90,90,' + (dangerT > 0 ? .12 : .04) + ')'; c.fillRect(WALL, 0, W - WALL * 2, DANGER);

        c.strokeStyle = 'rgba(120,90,0,.28)'; c.lineWidth = 2; c.setLineDash([4, 7]); c.beginPath(); c.moveTo(ax, DROPY + R[cur]); c.lineTo(ax, FLOOR); c.stroke(); c.setLineDash([]);

        c.save(); c.globalAlpha = 0.35; c.strokeStyle = COL[cur]; c.lineWidth = 2; c.setLineDash([3, 5]); c.beginPath(); c.arc(ax, FLOOR - R[cur], R[cur], 0, 6.28); c.stroke(); c.setLineDash([]); c.restore();

    c.fillStyle = 'rgba(255,255,255,.82)'; rr(c, W - 82, 10, 70, 78, 16); c.fill(); c.strokeStyle = 'rgba(26,22,18,.14)'; c.lineWidth = 1.5; rr(c, W - 82, 10, 70, 78, 16); c.stroke();
    c.fillStyle = '#4a3325'; c.font = '800 11px system-ui,-apple-system,"PingFang SC",sans-serif'; c.textAlign = 'center'; c.fillText('下一个', W - 47, 28);
    var sn = spr[nxt], k = 34 / Math.max(1, R[nxt]); c.save(); c.translate(W - 46, 60); c.scale(Math.min(1, k), Math.min(1, k)); c.drawImage(sn, -sn.__w * .5, -sn.__w * .5, sn.__w, sn.__w); c.restore();

    c.fillStyle = '#6a4400'; c.font = '800 12px system-ui,-apple-system,"PingFang SC",sans-serif'; c.textAlign = 'left'; c.fillText('币 ' + coins, 22, 33);

      c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 4; c.beginPath(); c.arc(ax2, DROPY - R[cur] - 18, 12, -Math.PI/2, -Math.PI/2 + pw * 6.28); c.stroke();
      c.strokeStyle = '#7CC93E'; c.lineWidth = 2.5; c.beginPath(); c.arc(ax2, DROPY - R[cur] - 18, 12, -Math.PI/2, -Math.PI/2 + pw * 6.28); c.stroke();

  }
