<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffd54a">
<title>合成大青蛙 · 奶蛙</title>
<link rel="stylesheet" href="/style.css">
<style>
  canvas { width: 100%; height: auto; display: block; background: #fff8e7; border-radius: 18px; border: 1.5px solid var(--line); box-shadow: var(--shadow); touch-action: none; }
</style>
</head>
<body>
  <div class="game-shell">
    <div class="game-top">
      <a class="back" href="/">← 合集</a>
      <h1>合成大青蛙</h1>
      <div class="score">分 <span id="score">0</span></div>
    </div>
    <canvas id="c" width="360" height="520"></canvas>
    <p class="hint">左右拖动瞄准，松手落下。相同等级碰到会合成为更大青蛙。</p>
    <p style="text-align:center;margin-top:10px"><button class="hud-btn" id="restart" type="button">再来一局</button></p>
  </div>
<script src="/assets/frog-draw.js"></script>
<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const FLOOR = H - 24, WALL = 12;
  const LEVELS = [
    { r: 16, pts: 1, tint: 0 },
    { r: 22, pts: 2, tint: 1 },
    { r: 28, pts: 4, tint: 2 },
    { r: 34, pts: 8, tint: 3 },
    { r: 42, pts: 16, tint: 4 },
    { r: 52, pts: 32, tint: 5 },
    { r: 64, pts: 64, tint: 6 },
  ];
  let balls = [], nextLv = 0, dropX = W/2, dropping = false, score = 0, over = false, waiting = null;

  function randLv(){ return Math.floor(Math.random() * 3); }
  function spawnWait(){ waiting = { lv: randLv(), x: dropX, y: 56 }; dropping = false; }

  function addBall(lv, x, y, vx, vy){
    const L = LEVELS[lv];
    balls.push({ lv, x, y, vx: vx||0, vy: vy||0, r: L.r, merged: false });
  }

  function physics(dt){
    const g = 1800;
    for (const b of balls){
      b.vy += g * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.vx *= 0.995;
      if (b.x - b.r < WALL){ b.x = WALL + b.r; b.vx *= -0.4; }
      if (b.x + b.r > W - WALL){ b.x = W - WALL - b.r; b.vx *= -0.4; }
      if (b.y + b.r > FLOOR){ b.y = FLOOR - b.r; b.vy *= -0.25; b.vx *= 0.9; if (Math.abs(b.vy) < 40) b.vy = 0; }
    }
    for (let i = 0; i < balls.length; i++){
      for (let j = i + 1; j < balls.length; j++){
        const a = balls[i], b = balls[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let dist = Math.hypot(dx, dy) || 0.001;
        const min = a.r + b.r;
        if (dist < min){
          if (a.lv === b.lv && a.lv < LEVELS.length - 1 && !a.merged && !b.merged){
            a.merged = b.merged = true;
            const nl = a.lv + 1;
            const nx = (a.x + b.x)/2, ny = (a.y + b.y)/2;
            score += LEVELS[nl].pts;
            document.getElementById('score').textContent = score;
            balls.splice(j,1); balls.splice(i,1);
            addBall(nl, nx, ny, 0, -80);
            return;
          }
          const nx = dx / dist, ny = dy / dist;
          const overlap = min - dist;
          a.x -= nx * overlap/2; a.y -= ny * overlap/2;
          b.x += nx * overlap/2; b.y += ny * overlap/2;
          const dvx = b.vx - a.vx, dvy = b.vy - a.vy;
          const vn = dvx * nx + dvy * ny;
          if (vn < 0){
            a.vx += vn * nx; a.vy += vn * ny;
            b.vx -= vn * nx; b.vy -= vn * ny;
          }
        }
      }
    }
    if (balls.some(b => b.y - b.r < 40 && Math.hypot(b.vx,b.vy) < 15)) over = true;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#ffe9a8';
    ctx.fillRect(0, FLOOR, W, H - FLOOR);
    ctx.strokeStyle = '#e57373'; ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(WALL, 70); ctx.lineTo(W-WALL, 70); ctx.stroke();
    ctx.setLineDash([]);
    if (waiting){
      const L = LEVELS[waiting.lv];
      ctx.globalAlpha = 0.9;
      drawBall(waiting.x, waiting.y, L, waiting.lv);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = 'rgba(230,168,0,.4)';
      ctx.beginPath(); ctx.moveTo(waiting.x, waiting.y + L.r); ctx.lineTo(waiting.x, FLOOR); ctx.stroke();
    }
    for (const b of balls) drawBall(b.x, b.y, LEVELS[b.lv], b.lv);
    if (over){
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 28px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('堆满啦!', W/2, H/2 - 10);
      ctx.font = '16px system-ui'; ctx.fillText('得分 ' + score, W/2, H/2 + 24);
    }
  }
  function drawBall(x,y,L,lv){
    const laugh = lv >= 5;
    NaiwaFrog.drawGoldenFrog(ctx, x, y, L.r * 0.92, { laugh, face: true });
  }

  let lastT = performance.now();
  function loop(t){
    const dt = Math.min(0.033, (t - lastT)/1000); lastT = t;
    if (!over){ for (let i=0;i<2;i++) physics(dt/2); }
    draw();
    requestAnimationFrame(loop);
  }

  function drop(){
    if (over || dropping || !waiting) return;
    addBall(waiting.lv, waiting.x, waiting.y, 0, 0);
    waiting = null; dropping = true;
    setTimeout(() => { if (!over) spawnWait(); }, 450);
  }
  function reset(){
    balls = []; score = 0; over = false; dropX = W/2;
    document.getElementById('score').textContent = '0';
    spawnWait();
  }

  function ptr(e){
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) * (W / r.width);
    dropX = Math.max(WALL+30, Math.min(W-WALL-30, x));
    if (waiting) waiting.x = dropX;
  }
  canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); ptr(e); });
  canvas.addEventListener('pointermove', e => { if (e.buttons || e.pressure) ptr(e); else ptr(e); });
  canvas.addEventListener('pointerup', () => drop());
  document.getElementById('restart').onclick = reset;
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
