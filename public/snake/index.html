<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#bfeaff">
<title>奶蛙贪吃蛇 · 奶蛙小游戏</title>
<meta name="description" content="控制奶蛙一路吃苍蝇，越长越长！奶蛙小游戏之贪吃蛇。">
<link rel="icon" type="image/png" href="/assets/favicon-frog.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:title" content="奶蛙贪吃蛇 · 奶蛙小游戏"><meta property="og:description" content="控制奶蛙一路吃苍蝇，越长越长！奶蛙小游戏之贪吃蛇。"><meta property="og:image" content="https://price-naiwa.onrender.com/assets/og.png">
<link rel="stylesheet" href="/style.css">
</head>
<body class="game">
<div class="nw-game">
  <div id="nw-top"></div><div id="nw-hud"></div>
  <main class="nw-stage" id="box"><canvas class="nw-canvas" id="cv"></canvas></main>
  <p class="nw-hint">在屏幕上滑动转向，吃到苍蝇就会变长</p>
</div>
<script src="/assets/frog.js"></script><script src="/assets/nw.js"></script>
<script>
(function () {
  var F = NaiwaFrog, box = document.getElementById('box'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var C = 15, R = 17, CS = 28, W = C * CS, H = R * CS, view = { s: 1 };
  var head = { n: F.sprite(F.bust({ mood: 'neutral', size: 120 }), CS * 1.9, CS * 1.9), w: F.sprite(F.bust({ mood: 'wow', size: 120 }), CS * 1.9, CS * 1.9), l: F.sprite(F.bust({ mood: 'laugh', size: 120 }), CS * 1.9, CS * 1.9) };
  var bodyS = [F.sprite(F.ball({ color: '#F7C32B', mood: 'neutral' }), CS * 1.15, CS * 1.15)];
  var fx = new NW.FX(), snake, dir, ndir, queue, food, tickT, speed, eatenT = 0, shakeT = 0, flies = 0, dead = false, prog = 0;
  var G = NW.mount({ key: 'snake', title: '奶蛙贪吃蛇', scoreLabel: '分数', rules: '在屏幕上滑动控制方向。吃到苍蝇身体会变长，别撞墙，也别咬到自己！', onStart: reset });
  function reset() { snake = [{ x: 7, y: 8 }, { x: 6, y: 8 }, { x: 5, y: 8 }]; snake.forEach(function (s) { s.px = s.x; s.py = s.y; }); dir = { x: 1, y: 0 }; ndir = dir; queue = []; speed = .15; tickT = 0; flies = 0; dead = false; prog = 0; G.setScore(0, false); spawn(); }
  function spawn() { var o; do { o = { x: Math.floor(Math.random() * C), y: Math.floor(Math.random() * R) }; } while (snake.some(function (s) { return s.x === o.x && s.y === o.y; })); food = o; }
  function resize() { NW.fit(cv, box, W / H, 480); view.s = cv.width / W; } window.addEventListener('resize', resize); resize();
  function turn(d) { var base = queue.length ? queue[queue.length - 1] : dir; if (d.x === -base.x && d.y === -base.y) return; if (d.x === base.x && d.y === base.y) return; if (queue.length < 2) queue.push(d); }
  var sx, sy, active = false;
  document.addEventListener('pointerdown', function (e) { if (e.target.closest('.nw-modal,.nw-top,button,a')) return; sx = e.clientX; sy = e.clientY; active = true; });
  document.addEventListener('pointermove', function (e) { if (!active || !G.running) return; var dx = e.clientX - sx, dy = e.clientY - sy; if (Math.max(Math.abs(dx), Math.abs(dy)) > 18) { turn(Math.abs(dx) > Math.abs(dy) ? { x: dx > 0 ? 1 : -1, y: 0 } : { x: 0, y: dy > 0 ? 1 : -1 }); sx = e.clientX; sy = e.clientY; } });
  window.addEventListener('pointerup', function () { active = false; });
  document.addEventListener('keydown', function (e) { var m = { ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 }, ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 }, w: { x: 0, y: -1 }, s: { x: 0, y: 1 } }[e.key]; if (m) { e.preventDefault(); turn(m); } });
  function step() {
    if (queue.length) dir = queue.shift(); var h = snake[0], nx = h.x + dir.x, ny = h.y + dir.y;
    var willEat = nx === food.x && ny === food.y, body = willEat ? snake : snake.slice(0, -1);
    if (nx < 0 || ny < 0 || nx >= C || ny >= R || body.some(function (s) { return s.x === nx && s.y === ny; })) return die(nx, ny);
    snake.forEach(function (s) { s.px = s.x; s.py = s.y; }); snake.unshift({ x: nx, y: ny, px: h.x, py: h.y }); snake[1].px = snake[1].x; snake[1].py = snake[1].y;
    if (willEat) { flies++; var pts = 10 + Math.min(40, flies * 2); G.setScore(G.score + pts); eatenT = .35; NW.sfx.eat(); NW.vib(8); var fx_ = food.x * CS + CS / 2, fy_ = food.y * CS + CS / 2; fx.burst(fx_, fy_, { count: 12, speed: 200, colors: ['#F7C32B', '#8FD14F', '#fff'], size: 6 }); fx.text(fx_, fy_ - 10, '+' + pts, { size: 20, color: '#e8a000' }); if (flies % 5 === 0) { fx.text(W / 2, H * .3, flies + ' 只苍蝇！', { size: 30, color: '#ff4a2a', life: 1.1 }); NW.sfx.combo(3); } speed = Math.max(.07, .15 - flies * .0035); spawn(); }
    else snake.pop();
    prog = 0;
  }
  function die(nx, ny) { dead = true; shakeT = .5; NW.sfx.lose(); NW.vib(40); var h = snake[0]; fx.burst(h.x * CS + CS / 2, h.y * CS + CS / 2, { count: 30, speed: 320, colors: ['#F7C32B', '#fff', '#ff6b5e'], size: 8 }); setTimeout(function () { G.over('吃了 ' + flies + ' 只苍蝇'); }, 600); }
  var last = performance.now();
  function frame(t) {
    var dt = Math.min(.033, (t - last) / 1000); last = t;
    if (G.running && !dead && snake) { tickT += dt; prog = Math.min(1, tickT / speed); while (tickT >= speed) { tickT -= speed; step(); if (dead) break; } if (!dead) prog = Math.min(1, tickT / speed); }
    if (eatenT > 0) eatenT -= dt; fx.update(dt); draw(t); requestAnimationFrame(frame);
  }
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function fly(c, x, y, t) { c.save(); c.translate(x, y + Math.sin(t / 200) * 2.5); c.fillStyle = 'rgba(0,0,0,.14)'; c.beginPath(); c.ellipse(0, 12, 7, 2.5, 0, 0, 7); c.fill(); var fl = Math.sin(t / 30) * .35; c.fillStyle = 'rgba(200,235,255,.85)'; c.strokeStyle = 'rgba(80,140,180,.6)'; c.lineWidth = 1; [-1, 1].forEach(function (s) { c.save(); c.rotate(s * (.6 + fl)); c.beginPath(); c.ellipse(s * 7, -5, 8, 4, s * .3, 0, 7); c.fill(); c.stroke(); c.restore(); }); var g = c.createRadialGradient(-2, -3, 1, 0, 0, 9); g.addColorStop(0, '#6a6a7a'); g.addColorStop(1, '#23232e'); c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, 7, 8, 0, 0, 7); c.fill(); c.fillStyle = '#ff5a4a'; [-3, 3].forEach(function (e) { c.beginPath(); c.arc(e, -5, 2.4, 0, 7); c.fill(); }); c.restore(); }
  function draw(t) {
    var c = ctx; c.setTransform(view.s, 0, 0, view.s, 0, 0); c.clearRect(0, 0, W, H); c.save();
    if (shakeT > 0) { shakeT -= .016; c.translate((Math.random() - .5) * 14 * shakeT, (Math.random() - .5) * 14 * shakeT); }
    c.save(); rr(c, 0, 0, W, H, 22); c.clip();
    for (var y = 0; y < R; y++) for (var x = 0; x < C; x++) { c.fillStyle = (x + y) % 2 ? '#b9e68a' : '#a9dd78'; c.fillRect(x * CS, y * CS, CS, CS); }
    var vg = c.createRadialGradient(W / 2, H / 2, W * .3, W / 2, H / 2, W * .85); vg.addColorStop(0, 'rgba(255,255,255,0)'); vg.addColorStop(1, 'rgba(60,120,20,.28)'); c.fillStyle = vg; c.fillRect(0, 0, W, H);
    if (snake) {
      if (food) fly(c, food.x * CS + CS / 2, food.y * CS + CS / 2, t);
      var p = prog; var pts = snake.map(function (s, i) { var a = i === 0 ? { x: s.px, y: s.py } : { x: s.px, y: s.py }; return { x: (s.px + (s.x - s.px) * p) * CS + CS / 2, y: (s.py + (s.y - s.py) * p) * CS + CS / 2 }; });
      for (var i = pts.length - 1; i >= 1; i--) { var sc = 1 - i * .008, sz = bodyS[0].__w * Math.max(.7, sc); c.fillStyle = 'rgba(40,90,10,.2)'; c.beginPath(); c.ellipse(pts[i].x, pts[i].y + CS * .38, CS * .38, CS * .13, 0, 0, 7); c.fill(); c.drawImage(bodyS[0], pts[i].x - sz / 2, pts[i].y - sz / 2 - 1, sz, sz); }
      var hs = eatenT > 0 || dead ? head.l : head.n, hz = hs.__w * (1 + (eatenT > 0 ? .12 : 0)); var ang = Math.atan2(dir.y, dir.x);
      c.save(); c.translate(pts[0].x, pts[0].y - 2); c.rotate(dir.x < 0 ? 0 : dir.x > 0 ? 0 : 0); c.fillStyle = 'rgba(40,90,10,.22)'; c.beginPath(); c.ellipse(0, CS * .55, CS * .5, CS * .15, 0, 0, 7); c.fill(); if (dir.x < 0) c.scale(1, 1); c.drawImage(hs, -hz / 2, -hz * .55, hz, hz); c.restore();
    }
    c.restore(); c.strokeStyle = '#fff'; c.lineWidth = 6; rr(c, 3, 3, W - 6, H - 6, 20); c.stroke(); fx.draw(c); c.restore();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
