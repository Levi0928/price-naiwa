<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#bfeaff">
<title>奶蛙贪吃蛇 · 奶蛙小游戏</title>
<meta name="description" content="控制奶蛙一路吃苍蝇，越长越长！奶蛙小游戏之贪吃蛇。">
<link rel="icon" type="image/png" href="/assets/favicon-frog.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:title" content="奶蛙贪吃蛇 · 奶蛙小游戏"><meta property="og:description" content="控制奶蛙一路吃苍蝇，越长越长！奶蛙小游戏之贪吃蛇。"><meta property="og:image" content="https://price-naiwa.onrender.com/assets/og.png">
<link rel="stylesheet" href="/style.css?v=feel1">
</head>
<body class="game">
<div class="nw-game">
  <div id="nw-top"></div><div id="nw-hud"></div>
  <main class="nw-stage" id="box"><canvas class="nw-canvas" id="cv"></canvas></main>
  <p class="nw-hint">滑动转向 · 苍蝇会跑 · 别撞墙也别咬自己</p>
</div>
<script src="/assets/frog.js?v=model3"></script><script src="/assets/nw.js?v=feel1"></script>
<script>
(function () {
  var F = NaiwaFrog, box = document.getElementById('box'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var C = 15, R = 17, CS = 28, W = C * CS, H = R * CS, view = { s: 1 };
  var head = { n: F.pieceSprite({ shape: 'bust', color: '#F7C32B', mood: 'neutral' }, CS * 1.95, CS * 1.95), w: F.pieceSprite({ shape: 'bust', color: '#F7C32B', mood: 'wow' }, CS * 1.95, CS * 1.95), l: F.pieceSprite({ shape: 'bust', color: '#F7C32B', mood: 'laugh' }, CS * 1.95, CS * 1.95) };
  var bodyS = [F.pieceSprite({ shape: 'ball', color: '#F7C32B', mood: 'neutral' }, CS * 1.2, CS * 1.2)];
  var fx = new NW.FX(), snake, dir, ndir, queue, food, tickT, speed, eatenT = 0, shakeT = 0, flies = 0, dead = false, prog = 0;
  var nearMiss = 0, mileShown = {}, fleeT = 0, edgeFlash = 0, streak = 0;
  var G = NW.mount({ key: 'snake', title: '奶蛙贪吃蛇', scoreLabel: '分数', extraCard: '长度', rules: '在屏幕上滑动控制方向。吃到苍蝇身体会变长；有的苍蝇会飞逃。别撞墙，也别咬到自己！', onStart: reset });
  function reset() {
    snake = [{ x: 7, y: 8 }, { x: 6, y: 8 }, { x: 5, y: 8 }];
    snake.forEach(function (s) { s.px = s.x; s.py = s.y; });
    dir = { x: 1, y: 0 }; ndir = dir; queue = []; speed = .14; tickT = 0; flies = 0; dead = false; prog = 0;
    eatenT = 0; shakeT = 0; nearMiss = 0; mileShown = {}; fleeT = 0; edgeFlash = 0; streak = 0;
    G.setScore(0, false); G.setExtra(3); spawn();
  }
  function spawn() {
    var o, tries = 0;
    do { o = { x: Math.floor(Math.random() * C), y: Math.floor(Math.random() * R) }; tries++; }
    while (tries < 80 && snake.some(function (s) { return s.x === o.x && s.y === o.y; }));
    o.flee = flies >= 3 && Math.random() < 0.28;
    o.hx = 0; o.hy = 0; o.ph = Math.random() * 6.28;
    food = o; fleeT = o.flee ? 1.2 + Math.random() * 1.6 : 0;
  }
  function resize() { NW.fit(cv, box, W / H, 480); view.s = cv.width / W; } window.addEventListener('resize', resize); resize();
  function turn(d) { var base = queue.length ? queue[queue.length - 1] : dir; if (d.x === -base.x && d.y === -base.y) return; if (d.x === base.x && d.y === base.y) return; if (queue.length < 2) queue.push(d); }
  var sx, sy, active = false;
  document.addEventListener('pointerdown', function (e) { if (e.target.closest('.nw-modal,.nw-top,button,a')) return; sx = e.clientX; sy = e.clientY; active = true; });
  document.addEventListener('pointermove', function (e) { if (!active || !G.running) return; var dx = e.clientX - sx, dy = e.clientY - sy; if (Math.max(Math.abs(dx), Math.abs(dy)) > 18) { turn(Math.abs(dx) > Math.abs(dy) ? { x: dx > 0 ? 1 : -1, y: 0 } : { x: 0, y: dy > 0 ? 1 : -1 }); sx = e.clientX; sy = e.clientY; } });
  window.addEventListener('pointerup', function () { active = false; });
  document.addEventListener('keydown', function (e) { var m = { ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 }, ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 }, w: { x: 0, y: -1 }, s: { x: 0, y: 1 } }[e.key]; if (m) { e.preventDefault(); turn(m); } });
  function milestone(n, label) {
    if (mileShown[n]) return; mileShown[n] = 1;
    fx.text(W / 2, H * .28, label, { size: 32, color: '#ff4a2a', life: 1.2 });
    NW.sfx.fanfare(); NW.vib(12);
  }
  function step() {
    if (queue.length) dir = queue.shift(); var h = snake[0], nx = h.x + dir.x, ny = h.y + dir.y;
    var willEat = nx === food.x && ny === food.y, body = willEat ? snake : snake.slice(0, -1);
    if (nx <= 0 || ny <= 0 || nx >= C - 1 || ny >= R - 1) {
      if (!(nx < 0 || ny < 0 || nx >= C || ny >= R) && nearMiss <= 0) {
        nearMiss = .45; edgeFlash = .5; NW.sfx.nearMiss();
      }
    }
    if (nx < 0 || ny < 0 || nx >= C || ny >= R || body.some(function (s) { return s.x === nx && s.y === ny; })) return die(nx, ny);
    snake.forEach(function (s) { s.px = s.x; s.py = s.y; }); snake.unshift({ x: nx, y: ny, px: h.x, py: h.y }); snake[1].px = snake[1].x; snake[1].py = snake[1].y;
    if (willEat) {
      flies++; streak++;
      var pts = 10 + Math.min(40, flies * 2) + (food.flee ? 8 : 0);
      G.setScore(G.score + pts); G.setExtra(snake.length + 1);
      eatenT = .35; NW.sfx.eat(); NW.vib(8);
      var fx_ = food.x * CS + CS / 2, fy_ = food.y * CS + CS / 2;
      fx.burst(fx_, fy_, { count: 12 + (food.flee ? 6 : 0), speed: 200, colors: ['#F7C32B', '#8FD14F', '#fff'], size: 6 });
      fx.text(fx_, fy_ - 10, '+' + pts, { size: 20, color: food.flee ? '#ff4a2a' : '#e8a000' });
      if (flies === 5) milestone(5, '开胃！5 只苍蝇');
      if (flies === 10) milestone(10, '十连吃 · 蛙肚鼓鼓');
      if (flies === 20) milestone(20, '二十只！蛇王预备');
      if (flies === 30) milestone(30, '三十苍蝇 · 奶蛙巨蟒');
      if (flies % 5 === 0 && flies > 0 && !mileShown[flies]) { fx.text(W / 2, H * .35, flies + ' 只苍蝇！', { size: 28, color: '#ff4a2a', life: 1.0 }); NW.sfx.combo(3); }
      speed = Math.max(.058, .14 - flies * .0038); spawn();
    } else { snake.pop(); streak = Math.max(0, streak); }
    prog = 0;
  }
  function die(nx, ny) {
    dead = true; shakeT = NW.reduceMotion() ? 0 : .5; NW.sfx.lose(); NW.vib(40);
    var h = snake[0]; fx.burst(h.x * CS + CS / 2, h.y * CS + CS / 2, { count: 30, speed: 320, colors: ['#F7C32B', '#fff', '#ff6b5e'], size: 8 });
    var grade = NW.grade(flies, [[30, '奶蛙巨蟒'], [20, '蛇王预备'], [10, '吃货达标'], [5, '开胃小口'], [0, '再练练']]);
    setTimeout(function () { G.over('吃了 ' + flies + ' 只 · 最长 ' + snake.length + ' · ' + grade); }, 600);
  }
  function tryFlee(dt) {
    if (!food || !food.flee || dead || !G.running) return;
    fleeT -= dt;
    if (fleeT > 0) return;
    fleeT = 0.55 + Math.random() * 0.55;
    var h = snake[0], opts = [[1,0],[-1,0],[0,1],[0,-1]], best = null, bestD = -1;
    for (var i = 0; i < opts.length; i++) {
      var nx = food.x + opts[i][0], ny = food.y + opts[i][1];
      if (nx < 1 || ny < 1 || nx >= C - 1 || ny >= R - 1) continue;
      if (snake.some(function (s) { return s.x === nx && s.y === ny; })) continue;
      var d = Math.abs(nx - h.x) + Math.abs(ny - h.y);
      if (d > bestD) { bestD = d; best = { x: nx, y: ny }; }
    }
    if (best) { food.x = best.x; food.y = best.y; }
  }
  var last = performance.now();
  function frame(t) {
    var dt = Math.min(.033, (t - last) / 1000); last = t;
    if (G.running && !dead && snake) {
      tickT += dt; prog = Math.min(1, tickT / speed);
      while (tickT >= speed) { tickT -= speed; step(); if (dead) break; }
      if (!dead) prog = Math.min(1, tickT / speed);
      tryFlee(dt);
    }
    if (eatenT > 0) eatenT -= dt;
    if (nearMiss > 0) nearMiss -= dt;
    if (edgeFlash > 0) edgeFlash -= dt;
    fx.update(dt); draw(t); requestAnimationFrame(frame);
  }
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function fly(c, x, y, t, flee) {
    c.save(); c.translate(x, y + Math.sin(t / 200) * 2.5); c.fillStyle = 'rgba(0,0,0,.14)'; c.beginPath(); c.ellipse(0, 12, 7, 2.5, 0, 0, 7); c.fill();
    var fl = Math.sin(t / 30) * .35; c.fillStyle = flee ? 'rgba(255,210,160,.9)' : 'rgba(200,235,255,.85)'; c.strokeStyle = flee ? 'rgba(200,100,40,.7)' : 'rgba(80,140,180,.6)'; c.lineWidth = 1;
    [-1, 1].forEach(function (s) { c.save(); c.rotate(s * (.6 + fl)); c.beginPath(); c.ellipse(s * 7, -5, 8, 4, s * .3, 0, 7); c.fill(); c.stroke(); c.restore(); });
    var g = c.createRadialGradient(-2, -3, 1, 0, 0, 9); g.addColorStop(0, flee ? '#8a5a3a' : '#6a6a7a'); g.addColorStop(1, flee ? '#3a2010' : '#23232e'); c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, 7, 8, 0, 0, 7); c.fill();
    c.fillStyle = '#ff5a4a'; [-3, 3].forEach(function (e) { c.beginPath(); c.arc(e, -5, 2.4, 0, 7); c.fill(); });
    if (flee) { c.fillStyle = '#ff8a00'; c.font = '900 9px sans-serif'; c.textAlign = 'center'; c.fillText('逃', 0, -14); }
    c.restore();
  }
  function draw(t) {
    var c = ctx; c.setTransform(view.s, 0, 0, view.s, 0, 0); c.clearRect(0, 0, W, H); c.save();
    if (shakeT > 0 && !NW.reduceMotion()) { shakeT -= .016; c.translate((Math.random() - .5) * 14 * shakeT, (Math.random() - .5) * 14 * shakeT); }
    else if (shakeT > 0) shakeT = 0;
    c.save(); rr(c, 0, 0, W, H, 22); c.clip();
    for (var y = 0; y < R; y++) for (var x = 0; x < C; x++) { c.fillStyle = (x + y) % 2 ? '#c8eb9a' : '#b6e085'; c.fillRect(x * CS, y * CS, CS, CS); }
    var vg = c.createRadialGradient(W / 2, H / 2, W * .3, W / 2, H / 2, W * .85); vg.addColorStop(0, 'rgba(255,255,255,0)'); vg.addColorStop(1, 'rgba(60,120,20,.28)'); c.fillStyle = vg; c.fillRect(0, 0, W, H);
    if (edgeFlash > 0) { c.fillStyle = 'rgba(255,255,255,' + (edgeFlash * .35) + ')'; c.fillRect(0, 0, W, H); c.strokeStyle = 'rgba(255,255,255,' + edgeFlash + ')'; c.lineWidth = 6; rr(c, 4, 4, W - 8, H - 8, 18); c.stroke(); }
    if (snake) {
      if (food) fly(c, food.x * CS + CS / 2, food.y * CS + CS / 2, t, food.flee);
      var p = prog; var pts = snake.map(function (s) { return { x: (s.px + (s.x - s.px) * p) * CS + CS / 2, y: (s.py + (s.y - s.py) * p) * CS + CS / 2 }; });
      for (var i = pts.length - 1; i >= 1; i--) { var sc = 1 - i * .008, sz = bodyS[0].__w * Math.max(.7, sc); c.fillStyle = 'rgba(40,90,10,.2)'; c.beginPath(); c.ellipse(pts[i].x, pts[i].y + CS * .38, CS * .38, CS * .13, 0, 0, 7); c.fill(); c.drawImage(bodyS[0], pts[i].x - sz / 2, pts[i].y - sz / 2 - 1, sz, sz); }
      var hs = eatenT > 0 || dead ? head.l : (nearMiss > 0 ? head.w : head.n), hz = hs.__w * (1 + (eatenT > 0 ? .12 : 0));
      c.save(); c.translate(pts[0].x, pts[0].y - 2); c.fillStyle = 'rgba(40,90,10,.22)'; c.beginPath(); c.ellipse(0, CS * .55, CS * .5, CS * .15, 0, 0, 7); c.fill(); c.drawImage(hs, -hz / 2, -hz * .55, hz, hz); c.restore();
    }
    c.restore(); c.strokeStyle = '#fff'; c.lineWidth = 6; rr(c, 3, 3, W - 6, H - 6, 20); c.stroke(); fx.draw(c); c.restore();
  }
  requestAnimationFrame(frame);
})();
</script>
