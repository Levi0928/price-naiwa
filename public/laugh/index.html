<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#bfeaff">
<title>狂笑点按 · 奶蛙小游戏</title>
<meta name="description" content="60 秒内点奶蛙，连击倍率最高 ×5！笑意槽满进 FEVER。">
<link rel="icon" type="image/png" href="/assets/favicon-frog.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:title" content="狂笑点按 · 奶蛙小游戏"><meta property="og:description" content="60 秒内疯狂点奶蛙，点得越快笑得越疯！"><meta property="og:image" content="https://price-naiwa.onrender.com/assets/og.png">
<link rel="stylesheet" href="/style.css?v=content1">
<style>
.scene { position: relative; width: 100%; height: 100%; border-radius: 28px; overflow: hidden; cursor: pointer; background: radial-gradient(circle at 50% 62%, #fff6b0, rgba(255,246,176,0) 62%), linear-gradient(180deg, #fff7ec 0%, #ffe9c2 45%, #fff1c8 100%); box-shadow: 0 14px 36px rgba(126,84,44,.18), 0 0 0 1.5px rgba(26,22,18,.12); touch-action: manipulation; }
.scene::before { content: ""; position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg at 50% 66%, rgba(255,255,255,.28) 0 7deg, transparent 7deg 20deg); transition: opacity .4s; opacity: .5; }
.scene.frenzy::before { opacity: 1; animation: spin 6s linear infinite; background: repeating-conic-gradient(from 0deg at 50% 66%, rgba(255,226,122,.7) 0 7deg, rgba(255,255,255,.2) 7deg 20deg); }
@keyframes spin { to { transform: rotate(360deg); } }
.grass { position: absolute; left: -5%; right: -5%; bottom: -2px; height: 22%; background: linear-gradient(180deg, #a9e566, #6bb82e); border-radius: 50% 50% 0 0 / 40% 40% 0 0; box-shadow: 0 -6px 0 rgba(255,255,255,.35); }
.fwrap { position: absolute; left: 50%; bottom: 6%; height: 74%; aspect-ratio: 567 / 946; transform: translateX(-50%); }
.fwrap .inner { position: absolute; inset: 0; transform-origin: 50% 100%; will-change: transform; }
.fwrap img, .fwrap svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .06s; }
.scene[data-m="idle"] .m-idle, .scene[data-m="laugh"] .m-laugh, .scene[data-m="cackle"] .m-cackle, .scene[data-m="peace"] .m-peace { opacity: 1; }
.meter { position: absolute; left: 14px; right: 14px; top: 14px; height: 16px; border-radius: 999px; background: rgba(255,255,255,.7); box-shadow: inset 0 2px 4px rgba(0,0,0,.15), 0 0 0 2px #fff; overflow: hidden; z-index: 4; }
.meter i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(180deg, #ffe27a, #ff9f43); transition: width .08s linear; box-shadow: inset 0 2px 0 rgba(255,255,255,.6); }
.scene.frenzy .meter i { background: linear-gradient(180deg, #ff9a6a, #ff5a5a); }
.meter-l { position: absolute; left: 0; right: 0; top: 34px; text-align: center; font-weight: 900; font-size: .8rem; color: #b86a00; z-index: 4; letter-spacing: .1em; text-shadow: 0 1px 0 #fff; }
.combo { position: absolute; right: 16px; top: 54px; z-index: 4; font-weight: 900; font-size: 1.7rem; color: #ff7a00; text-shadow: 0 2px 0 #fff, 0 0 8px #fff; transform-origin: 100% 50%; opacity: 0; }
.combo.on { opacity: 1; animation: nwpop .2s; }
.haha-float { position: absolute; font-weight: 900; pointer-events: none; z-index: 3; animation: hahaFloat 1.4s ease-out forwards; text-shadow: 0 2px 0 #fff; }
@keyframes hahaFloat { 0% { opacity: 0; transform: translateY(20px) scale(.5); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-60px) scale(1.2); } }
</style>
</head>
<body class="game">
<div class="nw-game">
  <div id="nw-top"></div><div id="nw-hud"></div>
  <main class="nw-stage">
    <div class="scene" id="scene" data-m="idle">
      <div class="meter"><i id="mt"></i></div><div class="meter-l" id="ml">笑意槽</div><div class="combo" id="cb"></div>
      <div class="grass"></div>
      <div class="fwrap"><div class="inner" id="fi"></div></div>
    </div>
  </main>
  <p class="nw-hint" id="hint">连挠越高倍率越高 · 槽满进入 FEVER 约 6.2 秒</p>
</div>
<script src="/assets/frog.js?v=content1"></script><script src="/assets/nw.js?v=content1"></script>
<script>
(function () {
  var F = NaiwaFrog, $ = function (s) { return document.querySelector(s); };
  var scene = $('#scene'), fi = $('#fi');
  fi.innerHTML =
    F.html({ pose: 'stand', className: 'm-idle nf-anim', style: 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain' }) +
    F.html({ mood: 'laugh', className: 'm-laugh', style: 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain' }) +
    F.html({ mood: 'laugh', className: 'm-cackle', style: 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scale(1.04)' }) +
    F.html({ pose: 'peace', className: 'm-peace', style: 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain' });
  var fx = new NW.FX(), ov = NW.overlay(scene), DUR = 60, FEVER = 6.2;
  var G = NW.mount({ key: 'laugh', title: '狂笑点按', extraCard: '倒计时', rules: '60 秒内点奶蛙！每连挠 5 下倍率 +1（最高 ×5）。笑意槽攒满进入 FEVER ' + FEVER + ' 秒（分数 ×2、笑声更密）。结局有评级。', onStart: reset });
  var left = DUR, combo = 0, maxCombo = 0, lastTap = 0, meter = 0, frenzy = 0, taps = 0, laughT = 0, hahaN = 0, tilt = 1, floatN = 0;
  var WORDS = ['哈哈哈', 'HAHA', '嘎嘎嘎', '啊哈哈'];
  var POS = [{ l: '12%', t: '30%' }, { l: 'auto', r: '12%', t: '26%' }, { l: '18%', t: '55%' }, { l: 'auto', r: '16%', t: '50%' }];
  function reset() {
    left = DUR; combo = 0; maxCombo = 0; meter = 0; frenzy = 0; taps = 0; lastTap = 0;
    if (NW.stopFeverGiggle) NW.stopFeverGiggle();
    G.setScore(0, false); G.setExtra(DUR); setM('idle'); $('#cb').classList.remove('on'); upd();
  }
  function setM(m) { scene.dataset.m = m; }
  function upd() { $('#mt').style.width = Math.min(100, meter) + '%'; $('#ml').textContent = frenzy > 0 ? ('FEVER ' + Math.ceil(frenzy) + 's ×2') : '笑意槽'; scene.classList.toggle('frenzy', frenzy > 0); }
  function floatHaha() {
    var el = document.createElement('div'); el.className = 'haha-float';
    var w = WORDS[floatN % WORDS.length]; el.textContent = w;
    var p = POS[floatN % POS.length]; floatN++;
    el.style.left = p.l || 'auto'; el.style.right = p.r || 'auto'; el.style.top = p.t;
    el.style.color = floatN % 2 ? '#1A1612' : '#FF4D4D';
    el.style.fontSize = (w.length > 3 ? 24 : 32) + 'px';
    scene.appendChild(el); setTimeout(function () { el.remove(); }, 1400);
  }
  function enterFever() {
    frenzy = FEVER; meter = 100; NW.sfx.win(); NW.shake(scene, 12, 400);
    fx.burst(ov.w / 2, ov.h * .4, { count: 40, speed: 420, size: 10 });
    fx.text(ov.w / 2, ov.h * .3, '狂笑模式！', { size: 40, color: '#ff4a2a', life: 1.3 });
    if (NW.startFeverGiggle) NW.startFeverGiggle();
    upd();
  }
  function exitFever() {
    frenzy = 0; meter = 0; setM('idle');
    if (NW.stopFeverGiggle) NW.stopFeverGiggle();
    upd();
  }
  function grade(score) {
    if (score >= 7000) return '笑到打滚';
    if (score >= 4500) return '一秒破绷';
    if (score >= 2500) return '噗嗤一声';
    if (score >= 1000) return '嘴角上扬';
    return '就这？';
  }
  scene.addEventListener('pointerdown', function (e) {
    var r = scene.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (!G.running) { NW.sfx.tap(); setM('laugh'); squash(); floatHaha(); clearTimeout(laughT); laughT = setTimeout(function () { setM('idle'); }, 700); return; }
    var now = performance.now(); combo = (now - lastTap < 650) ? combo + 1 : 1; lastTap = now; maxCombo = Math.max(maxCombo, combo); taps++;
    var mult = Math.min(5, 1 + Math.floor(combo / 5)), pts = mult * (frenzy > 0 ? 2 : 1);
    G.setScore(G.score + pts);
    // meter: ~18 taps to fill when not in fever (5.5 * 18 ≈ 99); slower decay when combo active
    if (frenzy <= 0) {
      meter += 5.5 + Math.min(2, combo * 0.08);
      if (meter >= 100) enterFever();
    }
    setM(frenzy > 0 ? (combo > 8 ? 'cackle' : 'laugh') : (combo > 12 ? 'cackle' : 'laugh'));
    clearTimeout(laughT); laughT = setTimeout(function () { setM(frenzy > 0 ? 'laugh' : 'idle'); }, frenzy > 0 ? 280 : 420);
    squash(); floatHaha(); NW.sfx.ha(hahaN++ % 6); NW.vib(12);
    fx.burst(x, y, { count: 7 + Math.min(10, combo), speed: 260 });
    fx.text(x + (Math.random() * 50 - 25), y - 20, ['哈', '哈哈', '嘿', '嘻嘻', '哈哈哈'][Math.floor(Math.random() * 5)], { size: 24 + Math.min(18, combo), color: ['#ff8a00', '#ff5a5a', '#e8a800', '#7cc93e'][hahaN % 4] });
    var c = $('#cb'); if (combo >= 3) { c.textContent = '×' + mult + ' 连击' + combo; c.classList.remove('on'); void c.offsetWidth; c.classList.add('on'); }
    if (combo > 0 && combo % 10 === 0) { NW.sfx.combo(combo / 10); fx.text(ov.w / 2, ov.h * .22, combo + ' 连击！', { size: 34, color: '#ff4a2a', life: 1.1 }); }
    upd();
  });
  function squash() {
    tilt = -tilt; fi.animate([{ transform: 'scale(1,1) rotate(0)' }, { transform: 'scale(1.1,.88) rotate(' + tilt * -2 + 'deg)', offset: .2 }, { transform: 'scale(.94,1.1) rotate(' + tilt * 3 + 'deg) translateY(-3%)', offset: .55 }, { transform: 'scale(1,1) rotate(0)' }], { duration: 260, easing: 'ease-out' });
  }
  var lt = performance.now();
  function loop(t) {
    var dt = Math.min(.05, (t - lt) / 1000); lt = t;
    if (G.running) {
      left -= dt; G.setExtra(Math.max(0, Math.ceil(left)));
      if (frenzy > 0) {
        frenzy -= dt; meter = Math.max(0, frenzy / FEVER * 100);
        if (frenzy <= 0) exitFever(); else upd();
      } else if (meter > 0) {
        // decay slower while recently tapping
        var decay = (performance.now() - lastTap < 400) ? 3.2 : 6.5;
        meter = Math.max(0, meter - dt * decay); upd();
      }
      if (combo > 0 && performance.now() - lastTap > 650) { combo = 0; $('#cb').classList.remove('on'); }
      if (left <= 0) {
        left = 0; setM('laugh'); if (NW.stopFeverGiggle) NW.stopFeverGiggle();
        G.over('评级「' + grade(G.score) + '」· 点了 ' + taps + ' 下 · 最高连击 ×' + maxCombo);
      }
    }
    fx.update(dt); ov.ctx.setTransform(ov.dpr, 0, 0, ov.dpr, 0, 0); ov.ctx.clearRect(0, 0, ov.w, ov.h); fx.draw(ov.ctx);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
