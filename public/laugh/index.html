<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#bfeaff">
<title>奶蛙狂笑 · 奶蛙小游戏</title>
<meta name="description" content="点一下奶蛙，它会笑完这一段。可以循环，也可以立刻停回开头。">
<link rel="icon" type="image/png" href="/assets/favicon-frog.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css?v=q2">
<style>
.scene { position: relative; width: 100%; height: 100%; border-radius: 28px; overflow: hidden; cursor: pointer; background: radial-gradient(circle at 50% 58%, #fff6b0, rgba(255,246,176,0) 58%), linear-gradient(180deg, #fffaf0 0%, #ffe4b0 45%, #fff1c8 100%); box-shadow: 0 18px 40px rgba(126,84,44,.2), 0 0 0 1.5px rgba(26,22,18,.1), inset 0 1px 0 rgba(255,255,255,.55); touch-action: manipulation; }
.grass { position: absolute; left: -5%; right: -5%; bottom: -2px; height: 22%; background: linear-gradient(180deg, #a9e566, #6bb82e); border-radius: 50% 50% 0 0 / 40% 40% 0 0; box-shadow: 0 -6px 0 rgba(255,255,255,.35); }
.fwrap { position: absolute; left: 50%; bottom: 8%; height: 72%; aspect-ratio: 567 / 946; transform: translateX(-50%); }
.fwrap .inner { position: absolute; inset: 0; transform-origin: 50% 58%; will-change: transform; }
.fwrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; }
.scene[data-face="stand"] .m-idle, .scene[data-face="laugh"] .m-laugh { opacity: 1; }
.haha { position: absolute; font-weight: 900; pointer-events: none; z-index: 3; opacity: 0; white-space: nowrap; text-shadow: 0 2px 0 #fff; }
.scene.hahaing .haha { animation: hahaFloat 1.4s ease-out infinite; }
.haha.h1 { left: 8%; top: 24%; font-size: 32px; color: #1A1612; animation-delay: 0s; }
.haha.h2 { right: 10%; top: 20%; font-size: 28px; color: #FF4D4D; animation-delay: .35s; }
.haha.h3 { left: 14%; top: 52%; font-size: 24px; color: #1A1612; animation-delay: .7s; }
.haha.h4 { right: 12%; top: 48%; font-size: 26px; color: #FF4D4D; animation-delay: .15s; }
@keyframes hahaFloat { 0% { opacity: 0; transform: translateY(16px) scale(.55); } 18% { opacity: 1; } 100% { opacity: 0; transform: translateY(-54px) scale(1.12); } }
.loop-btn, .stop-btn { position: absolute; z-index: 6; border: 0; border-radius: 999px; padding: 10px 14px; font-weight: 900; font-size: .85rem; background: linear-gradient(180deg,#fff,#f6efdc); color: #6a4400; box-shadow: 0 5px 0 rgba(26,22,18,.12), 0 10px 18px rgba(0,0,0,.12), inset 0 1px 0 #fff; cursor: pointer; min-height: 44px; }
.loop-btn { right: 14px; bottom: 14px; }
.stop-btn { left: 14px; bottom: 14px; width: 48px; padding: 0; }
.loop-btn.on { background: linear-gradient(180deg,#ffe27a,#ff9f43); color: #4a2200; box-shadow: 0 4px 0 #d97820, 0 8px 18px rgba(255,140,0,.35); }
.loop-btn:active, .stop-btn:active { transform: translateY(2px); }
.frog-loading { position: absolute; left: 50%; top: 42%; z-index: 4; display: none; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,.92); box-shadow: 0 2px 12px rgba(26,22,18,.18); pointer-events: none; }
.frog-loading::after { content: ""; position: absolute; inset: 13px; border: 3px solid rgba(26,22,18,.18); border-top-color: #1A1612; border-radius: 50%; animation: frogSpin .8s linear infinite; }
.scene.is-loading .frog-loading { display: block; }
@keyframes frogSpin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="game">
<div class="nw-game">
  <div id="nw-top" class="nw-top">
    <a class="round-btn" href="/" aria-label="返回合集"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1><img src="/assets/favicon-frog.png" alt="">奶蛙狂笑</h1>
    <button class="round-btn" id="nw-vol" type="button" aria-label="音量设置"></button>
    <button class="round-btn" id="nw-snd" type="button" aria-label="音效开关"></button>
  </div>
  <main class="nw-stage">
    <div class="scene" id="scene" data-face="stand" tabindex="0" role="button" aria-label="点击让奶蛙笑">
      <span class="haha h1">哈哈哈</span>
      <span class="haha h2">HAHA</span>
      <span class="haha h3">嘎嘎嘎</span>
      <span class="haha h4">啊哈哈</span>
      <div class="frog-loading" aria-hidden="true"></div>
      <div class="grass"></div>
      <div class="fwrap"><div class="inner" id="fi"></div></div>
      <button type="button" class="stop-btn" id="stopBtn" hidden aria-label="停止，回到开头">🚫</button>
      <button type="button" class="loop-btn" id="loopBtn" aria-pressed="false">循环大笑</button>
    </div>
  </main>
  <p class="nw-hint" id="hint">点一下开笑。正在笑时再点不会重来。循环会整段重播，🚫 回到开头。</p>
</div>
<audio id="laughAudio" preload="auto" playsinline src="/assets/audio/laugh_take.wav?v=sfx3"></audio>
<script src="/assets/frog.js?v=q2"></script>
<script src="/assets/nw.js?v=laughref1"></script>
<script src="/laugh/seq.js?v=laughref1"></script>
<script>
(function () {
  var F = NaiwaFrog;
  var S = LaughSeq;
  var scene = document.getElementById('scene');
  var fi = document.getElementById('fi');
  var audio = document.getElementById('laughAudio');
  var stopBtn = document.getElementById('stopBtn');
  var loopBtn = document.getElementById('loopBtn');
  var ctl = S.create();
  var loadTimer = 0;
  fi.innerHTML =
    F.html({ pose: 'stand', className: 'm-idle', style: 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain' }) +
    F.html({ mood: 'laugh', className: 'm-laugh', style: 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain' });
  NW.bindVolButton(document.getElementById('nw-vol'));
  NW.bindMuteButton(document.getElementById('nw-snd'));
  NW.bindLaughMedia(audio);
  if (NW.isMuted && NW.isMuted()) document.getElementById('nw-snd').classList.add('muted');

  function setLoading(on) {
    clearTimeout(loadTimer);
    if (on) loadTimer = setTimeout(function () { scene.classList.add('is-loading'); }, 200);
    else scene.classList.remove('is-loading');
  }
  function applyCommand(cmd) {
    if (!cmd) return;
    if (cmd.op === 'play') {
      audio.loop = !!cmd.loop;
      audio.playbackRate = 1;
      if (audio.currentTime > 0.05) {
        try { audio.currentTime = 0; } catch (e) {}
      }
      NW.bindLaughMedia(audio);
      setLoading(true);
      var p = audio.play();
      if (p && p.then) p.then(function () { setLoading(false); }, function () {
        var stopped = ctl.stop();
        applyCommand(stopped.command);
        render();
        NW.toast('浏览器拦下了声音，再点一次奶蛙');
      });
    } else if (cmd.op === 'stop') {
      audio.loop = false;
      audio.pause();
      try { audio.currentTime = 0; } catch (e) {}
      setLoading(false);
    }
  }
  function render() {
    var snap = ctl.snapshot();
    var t = snap.state === 'playing' ? (audio.currentTime || 0) : 0;
    var vis = S.visualAt(t, snap.state);
    scene.dataset.face = vis.face;
    scene.classList.toggle('hahaing', vis.haha);
    stopBtn.hidden = !vis.showStop;
    loopBtn.classList.toggle('on', snap.loop);
    loopBtn.setAttribute('aria-pressed', snap.loop ? 'true' : 'false');
    loopBtn.textContent = snap.loop ? '循环大笑 ON' : '循环大笑';
    if (snap.state === 'playing') audio.loop = !!snap.loop;
    var reduce = NW.reduceMotion && NW.reduceMotion();
    var pulse = reduce ? 0 : vis.pulse;
    var fit = 1 - vis.lie * 0.34;
    var sx = (1 + pulse * 0.12) * fit;
    var sy = (1 - pulse * 0.14) * fit;
    var rot = -58 * vis.lie;
    var ty = 10 * vis.lie;
    fi.style.transform = 'translateY(' + ty + '%) rotate(' + rot + 'deg) scale(' + sx + ',' + sy + ')';
  }
  function take(res) {
    if (!res) return;
    if (res.command) applyCommand(res.command);
    if (res.start && res.start.command) applyCommand(res.start.command);
    render();
  }
  scene.addEventListener('pointerdown', function (e) {
    if (e.target.closest('button')) return;
    if (NW.unlockAudio) NW.unlockAudio();
    take(ctl.pointerDown());
  });
  scene.addEventListener('keydown', function (e) {
    if (e.key !== ' ' && e.key !== 'Enter') return;
    e.preventDefault();
    if (NW.unlockAudio) NW.unlockAudio();
    take(ctl.key(e.key));
  });
  stopBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  stopBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    take(ctl.stop());
  });
  loopBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  loopBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (NW.unlockAudio) NW.unlockAudio();
    take(ctl.toggleLoop());
  });
  audio.addEventListener('playing', function () { setLoading(false); });
  audio.addEventListener('waiting', function () { if (ctl.snapshot().state === 'playing') setLoading(true); });
  audio.addEventListener('ended', function () {
    var snap = ctl.snapshot();
    if (snap.loop && snap.state === 'playing') {
      try { audio.currentTime = 0; } catch (e) {}
      audio.playbackRate = 1;
      var p = audio.play();
      if (p && p.catch) p.catch(function () {});
      return;
    }
    ctl.finish();
    setLoading(false);
    render();
  });
  audio.addEventListener('error', function () {
    if (ctl.snapshot().state === 'playing') {
      take(ctl.stop());
      NW.toast('笑声文件没载入');
    }
  });
  var lastTouch = 0;
  scene.addEventListener('touchend', function (e) {
    var n = Date.now();
    if (n - lastTouch < 320) e.preventDefault();
    lastTouch = n;
  }, { passive: false });
  function tick() { render(); requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
