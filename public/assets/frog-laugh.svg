<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" role="img" aria-label="狂笑金蛙">
  <defs>
    <radialGradient id="bodyGradL" cx="42%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="55%" stop-color="#ffd54a"/>
      <stop offset="100%" stop-color="#f0b429"/>
    </radialGradient>
    <radialGradient id="bellyGradL" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff6d6"/>
      <stop offset="100%" stop-color="#f5e6b8"/>
    </radialGradient>
    <radialGradient id="eyeGradL" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c8f070"/>
      <stop offset="100%" stop-color="#8bc34a"/>
    </radialGradient>
    <linearGradient id="limbGradL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b8f3a"/>
      <stop offset="100%" stop-color="#3d5a1f"/>
    </linearGradient>
    <radialGradient id="mouthFill" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ff8a80"/>
      <stop offset="100%" stop-color="#c62828"/>
    </radialGradient>
    <filter id="softL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#c9a227" flood-opacity="0.35"/>
    </filter>
  </defs>
  <ellipse cx="100" cy="226" rx="52" ry="9" fill="rgba(180,140,40,0.22)"/>
  <g filter="url(#softL)">
    <ellipse cx="70" cy="208" rx="24" ry="12" fill="url(#limbGradL)"/>
    <ellipse cx="130" cy="208" rx="24" ry="12" fill="url(#limbGradL)"/>
    <ellipse cx="76" cy="184" rx="17" ry="22" fill="url(#bodyGradL)"/>
    <ellipse cx="124" cy="184" rx="17" ry="22" fill="url(#bodyGradL)"/>
    <ellipse cx="100" cy="122" rx="72" ry="80" fill="url(#bodyGradL)"/>
    <ellipse cx="100" cy="148" rx="40" ry="40" fill="url(#bellyGradL)"/>
    <!-- arms up -->
    <ellipse cx="36" cy="100" rx="16" ry="22" fill="url(#bodyGradL)" transform="rotate(-40 36 100)"/>
    <ellipse cx="164" cy="100" rx="16" ry="22" fill="url(#bodyGradL)" transform="rotate(40 164 100)"/>
    <ellipse cx="28" cy="78" rx="15" ry="12" fill="url(#limbGradL)"/>
    <ellipse cx="172" cy="78" rx="15" ry="12" fill="url(#limbGradL)"/>
    <!-- eyes squinting -->
    <ellipse cx="70" cy="88" rx="28" ry="26" fill="url(#eyeGradL)"/>
    <ellipse cx="130" cy="88" rx="28" ry="26" fill="url(#eyeGradL)"/>
    <path d="M52 90 Q70 78 88 90" stroke="#1a1a14" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M112 90 Q130 78 148 90" stroke="#1a1a14" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- big laugh mouth -->
    <ellipse cx="100" cy="138" rx="36" ry="28" fill="url(#mouthFill)"/>
    <ellipse cx="100" cy="128" rx="30" ry="10" fill="#fff8e7"/>
    <path d="M70 132 Q100 148 130 132" fill="none" stroke="#fff" stroke-width="2" opacity="0.35"/>
  </g>
</svg>
