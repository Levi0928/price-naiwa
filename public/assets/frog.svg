<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" role="img" aria-label="金蛙">
  <defs>
    <radialGradient id="bodyGrad" cx="42%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="55%" stop-color="#ffd54a"/>
      <stop offset="100%" stop-color="#f0b429"/>
    </radialGradient>
    <radialGradient id="bellyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff6d6"/>
      <stop offset="100%" stop-color="#f5e6b8"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c8f070"/>
      <stop offset="100%" stop-color="#8bc34a"/>
    </radialGradient>
    <linearGradient id="limbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b8f3a"/>
      <stop offset="100%" stop-color="#3d5a1f"/>
    </linearGradient>
    <radialGradient id="shade" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(120,80,0,0.18)"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#c9a227" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- soft ground shadow -->
  <ellipse cx="100" cy="226" rx="48" ry="8" fill="rgba(180,140,40,0.22)"/>
  <g filter="url(#soft)">
    <!-- feet -->
    <ellipse cx="72" cy="208" rx="22" ry="12" fill="url(#limbGrad)"/>
    <ellipse cx="128" cy="208" rx="22" ry="12" fill="url(#limbGrad)"/>
    <!-- legs -->
    <ellipse cx="78" cy="186" rx="16" ry="22" fill="url(#bodyGrad)"/>
    <ellipse cx="122" cy="186" rx="16" ry="22" fill="url(#bodyGrad)"/>
    <!-- body pear -->
    <ellipse cx="100" cy="128" rx="68" ry="78" fill="url(#bodyGrad)"/>
    <ellipse cx="100" cy="128" rx="68" ry="78" fill="url(#shade)"/>
    <!-- belly -->
    <ellipse cx="100" cy="148" rx="38" ry="42" fill="url(#bellyGrad)"/>
    <!-- arms resting on belly -->
    <ellipse cx="48" cy="140" rx="18" ry="14" fill="url(#bodyGrad)" transform="rotate(-18 48 140)"/>
    <ellipse cx="152" cy="140" rx="18" ry="14" fill="url(#bodyGrad)" transform="rotate(18 152 140)"/>
    <!-- hands -->
    <ellipse cx="58" cy="158" rx="16" ry="12" fill="url(#limbGrad)"/>
    <ellipse cx="142" cy="158" rx="16" ry="12" fill="url(#limbGrad)"/>
    <!-- fingers hint -->
    <circle cx="50" cy="162" r="4.5" fill="#3d5a1f"/>
    <circle cx="58" cy="166" r="4.5" fill="#3d5a1f"/>
    <circle cx="66" cy="162" r="4.5" fill="#3d5a1f"/>
    <circle cx="134" cy="162" r="4.5" fill="#3d5a1f"/>
    <circle cx="142" cy="166" r="4.5" fill="#3d5a1f"/>
    <circle cx="150" cy="162" r="4.5" fill="#3d5a1f"/>
    <!-- eyes bulging -->
    <ellipse cx="72" cy="96" rx="26" ry="28" fill="url(#eyeGrad)"/>
    <ellipse cx="128" cy="96" rx="26" ry="28" fill="url(#eyeGrad)"/>
    <ellipse cx="72" cy="96" rx="26" ry="28" fill="rgba(255,255,255,0.18)"/>
    <ellipse cx="128" cy="96" rx="26" ry="28" fill="rgba(255,255,255,0.18)"/>
    <!-- pupils -->
    <circle cx="76" cy="100" r="9" fill="#1a1a14"/>
    <circle cx="124" cy="100" r="9" fill="#1a1a14"/>
    <circle cx="79" cy="96" r="3" fill="#fff" opacity="0.85"/>
    <circle cx="127" cy="96" r="3" fill="#fff" opacity="0.85"/>
    <!-- mouth neutral slit -->
    <path d="M86 128 Q100 134 114 128" stroke="#5a4a20" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
