      '<svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 100 75"><path d="M12 48Q40 20 88 28" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M12 48Q40 20 88 28" fill="none" stroke="#FFD23F" stroke-width="1.4" stroke-linecap="round"/></svg></div>',
    expedition: '<div style="position:absolute;inset:0;background:linear-gradient(160deg,#ffe9a8,#ffd266 50%,#ffb84d)"></div><div class="t-pop" style="position:absolute;inset:0">' +
      im(peaceUrl, 'left:8%;bottom:-4%;height:88%') + im(B('#B28DFF', 'wow'), 'right:6%;top:18%;width:34%') +
      '<div style="position:absolute;right:8%;bottom:10%;left:48%;display:flex;gap:4px">' +
      ['#F7C32B','#5CC8F2','#FF7BAC'].map(function(c,i){return '<div style="flex:1;aspect-ratio:.72;border-radius:8px;background:linear-gradient(180deg,#fff,#fff4d6);border:2px solid #f0cf6a;box-shadow:0 3px 0 #d4b86a;transform:rotate('+(i*4-4)+'deg)"></div>';}).join('') +
      '</div></div>',
    color: '<div style="position:absolute;inset:0;background:linear-gradient(160deg,#cfe9ff,#eaf7ff)"></div><div class="t-pop" style="position:absolute;left:12%;right:12%;top:14%;bottom:14%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;border-radius:16px;background:rgba(255,255,255,.5);box-shadow:inset 0 0 0 3px #fff">' +
      ['#5CC8F2','#5CC8F2','#5aa8e8','#5CC8F2','#5CC8F2','#5CC8F2','#5CC8F2','#5CC8F2','#5CC8F2'].map(function(c,i){return '<div style="border-radius:12px;background:'+c+';position:relative;box-shadow:0 3px 0 rgba(0,0,0,.12)">' + im(B('#F7C32B', i===2?'laugh':'neutral'), 'left:12%;top:10%;width:76%') + '</div>';}).join('') + '</div>',
    gravity2048: '<div style="position:absolute;inset:0;background:linear-gradient(160deg,#cfe9ff,#9fc5ff)"></div><div class="t-pop" style="position:absolute;left:12%;right:12%;top:8%;bottom:8%;border-radius:20px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 3px #fff">' +
      [[8, 52, '#F7C32B', 34, 'laugh'], [40, 56, '#FF9F43', 30, 'neutral'], [68, 60, '#FF7BAC', 24, 'wow'], [26, 18, '#8FD14F', 26, 'neutral'], [60, 26, '#5CC8F2', 24, 'laugh']].map(function (b) { return im(B(b[2], b[4]), 'left:' + b[0] + '%;top:' + b[1] + '%;width:' + b[3] + '%'); }).join('') + '<svg style="position:absolute;right:8px;top:8px;width:26px;height:26px" viewBox="0 0 24 24"><path d="M12 4v13M6 12l6 6 6-6" fill="none" stroke="#3b6fd8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'
  };
  var G = [
    ['laugh', '狂笑点按', '30 秒拼手速，点得越快它笑得越疯。', ['点按', '爽'], '热门'],
    ['run', '奶蛙神跑', '方向键移动，空格二段跳，滑铲躲障，无尽跑酷。', ['跑酷', '街机'], '新'],
    ['slice', '切奶蛙', '滑动切开飞来的奶蛙，连击翻倍，别切坏奶。', ['切割', '反应'], '新'],
    ['expedition', '奶蛙远征', '能量出手、叠盾叠毒、爬塔选牌，原创卡牌肉鸽。', ['卡牌', '肉鸽'], '新'],
    ['color', '颜色大挑战', '在相近色里找出不一样的奶蛙，色差越来越小。', ['眼力', '益智'], '新'],
    ['merge', '合成大奶蛙', '同款相撞升级，合出最大的金色奶蛙。', ['物理', '合成'], '推荐'],
    ['g2048', '奶蛙 2048', '滑动合并，冲击 2048 与更高。', ['益智', '数字']],
    ['match3', '奶蛙消消乐', '交换相邻奶蛙，连成三个就消除。', ['消除', '连击']],
    ['snake', '贪吃蛙', '滑动控制方向，吃苍蝇越长越快。', ['经典', '街机']],
    ['jump', '跳一跳', '长按蓄力松手起跳，落中心加分。', ['蓄力', '精准']],
    ['milkrain', '奶滴接接乐', '拖动小蛙，接住从天而降的奶块。', ['接物', '反应'], '新'],
    ['breakout', '奶蛙打砖块', '弹球反弹，打光所有彩色砖块。', ['街机', '反弹'], '新'],
    ['tetris', '俄罗斯奶块', '旋转堆叠，消除整行，越玩越快。', ['经典', '方块']],
    ['tilematch', '奶了个蛙', '三消叠叠乐：点牌入槽，三张相同就消除。', ['三消', '烧脑']],
    ['bubble', '泡泡奶蛙', '瞄准发射，三个同色泡泡一起炸。', ['泡泡龙', '瞄准']],
    ['gomoku', '奶蛙五子棋', '人机对战，先连成五子的获胜。', ['棋类', '人机']],
    ['gravity2048', '重力 2048', '滑动改变重力，让奶蛙滚在一起合并。', ['物理', '数字'], '新']
  ];
  var tagc = ['y', 'b', 'p', ''];
  $('#grid').innerHTML = G.map(function (g, i) {
    var best = NW.store.get('best_' + g[0], 0);
    return '<a class="card reveal" style="transition-delay:' + (i % 3) * 70 + 'ms" href="/' + g[0] + '/"><div class="thumb">' + TH[g[0]] + (g[4] ? '<span class="ribbon">' + g[4] + '</span>' : '') + (best ? '<span class="bestchip">最高 ' + best + '</span>' : '') + '</div><div class="info"><h3>' + g[1] + '</h3><p>' + g[2] + '</p><div class="foot"><span>' + g[3].map(function (t, k) { return '<span class="tag ' + tagc[(i + k) % 4] + '">' + t + '</span> '; }).join('') + '</span><span class="go"><svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg></span></div></div></a>';
  }).join('') + '<div class="card reveal soon" style="transition-delay:70ms;border:3px dashed #f0cf6a;background:rgba(255,255,255,.55);box-shadow:none;display:grid;place-items:center;text-align:center;padding:18px"><div><div style="width:84px;margin:0 auto 8px">' + F.html({ pose: 'stand', sm: true, width: 84, style: 'width:84px;height:auto;display:block;margin:0 auto' }) + '</div><h3 style="margin:0;font-weight:900;color:#6a4400">更多游戏</h3><p style="margin:4px 0 0;font-size:.85rem;color:#a8935a;font-weight:600">奶蛙还在偷偷做新游戏<br>敬请期待</p></div></div>';

  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { threshold: .08, rootMargin: '80px 0px' }) : null;
  document.querySelectorAll('.reveal').forEach(function (el) {
    el.classList.add('in'); /* 立即可见，避免 IO/JS 异常导致永远透明 */
    if (io) io.observe(el);
  });
  setTimeout(function () { document.querySelectorAll('.reveal:not(.in)').forEach(function (el) { el.classList.add('in'); }); }, 200);
  document.querySelectorAll('a[href^="#"]').forEach(function (a) { a.addEventListener('click', function (e) { var t = document.querySelector(a.getAttribute('href')); if (t) { e.preventDefault(); t.scrollIntoView({ behavior: 'smooth', block: 'start' }); } }); });
  document.querySelectorAll('#grid a.card').forEach(function (a) { a.addEventListener('click', function () { NW.sfx.click(); }); });
})();
