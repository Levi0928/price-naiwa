<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#bfeaff">
<title>切奶蛙 · 奶蛙小游戏</title>
<meta name="description" content="45 秒划切飞来的 3D 奶蛙，连斩翻倍，别切坏奶炸弹。八关挑战 + 练习模式。">
<link rel="icon" type="image/png" href="/assets/favicon-frog.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:title" content="切奶蛙 · 奶蛙小游戏"><meta property="og:description" content="划屏切开奶蛙，45 秒冲目标分，八关挑战。"><meta property="og:image" content="https://price-naiwa.onrender.com/assets/og.png">
<link rel="stylesheet" href="/style.css?v=slice3">
<style>
.sl-lv{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px 12px 4px}
.sl-lv button{min-width:44px;min-height:44px;border-radius:12px;border:2px solid #f0cf6a;background:#fff8e0;font-weight:800;color:#6a4400;cursor:pointer}
.sl-lv button.on{background:#F7C32B;border-color:#c88e10}
.sl-lv button.done{box-shadow:inset 0 0 0 2px #7CC93E}
.sl-modes{display:flex;gap:8px;justify-content:center;padding:0 12px 8px}
.sl-modes button{min-height:40px;padding:0 14px;border-radius:999px;border:2px solid #cde6ff;background:#fff;font-weight:700;color:#3a6a90;cursor:pointer}
.sl-modes button.on{background:#5CC8F2;color:#fff;border-color:#3A9FCC}
</style>
</head>
<body class="game">
<div class="nw-game">
  <div id="nw-top"></div><div id="nw-hud"></div>
  <div class="sl-modes"><button type="button" id="m-story" class="on">闯关</button><button type="button" id="m-practice">练习无尽</button></div>
  <div class="sl-lv" id="lvbar"></div>
  <main class="nw-stage" id="box"><canvas class="nw-canvas" id="cv"></canvas></main>
  <p class="nw-hint">快速滑动切开奶蛙 · 慢拖无效 · 深色坏奶别切 · 空格暂停</p>
</div>
<script src="/assets/frog.js?v=slice3"></script><script src="/assets/nw.js?v=vol1"></script>
<script>
(function () {
  /* CFG — quality-bar §6 */
  var CFG = {
    DUR: 45, SLASH_MIN: 600, GRAV: 1800,
    BOMB_START: 0.08, BOMB_END: 0.18,
    HITSTOP: 0.035, HITSTOP_COMBO: 0.05, HITSTOP_BOMB: 0.15,
    TRAIL_MS: 100, COMBO_GAP: 0.35
  };
  var LEVELS = [
    { name: '热身', goal: 120, bombScale: 0.7, ice: 0, colorOnly: null, dens: 1 },
    { name: '加速', goal: 220, bombScale: 0.9, ice: 0, colorOnly: null, dens: 1.12 },
    { name: '认准金色', goal: 280, bombScale: 1, ice: 0, colorOnly: '#F7C32B', dens: 1.18 },
    { name: '冰壳来了', goal: 320, bombScale: 1.05, ice: 0.32, colorOnly: null, dens: 1.22 },
    { name: '双抛', goal: 360, bombScale: 1.1, ice: 0.18, colorOnly: null, dens: 1.28, twin: 0.4 },
    { name: '蛙雨', goal: 420, bombScale: 1.15, ice: 0.25, colorOnly: null, dens: 1.4 },
    { name: '金冰双修', goal: 480, bombScale: 1.2, ice: 0.4, colorOnly: '#F7C32B', dens: 1.35 },
    { name: '终极乱切', goal: 560, bombScale: 1.3, ice: 0.3, colorOnly: null, dens: 1.55, twin: 0.45 }
  ];
  var WAVES = [
    { t: 0, n: 2, gap: 140 },
    { t: 8, n: 3, gap: 110 },
    { t: 16, n: 3, gap: 95 },
    { t: 24, n: 4, gap: 85 },
    { t: 32, n: 4, gap: 75 },
    { t: 40, n: 5, gap: 70 }
  ];

  var F = NaiwaFrog, box = document.getElementById('box'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var W = 360, H = 560, view = { s: 1 }, RM = NW.reduceMotion && NW.reduceMotion();
  var COLS = ['#F7C32B', '#8FD14F', '#FF9F43', '#FF7BAC', '#5CC8F2', '#B28DFF', '#3ED3B5'];
  var MOODS = ['laugh', 'neutral', 'wow', 'laugh', 'neutral', 'laugh', 'wow'];
  var sprBall = COLS.map(function (c, i) { return F.pieceSprite({ shape: 'ball', color: c, mood: MOODS[i] }, 96, 96); });
  var sprBomb = F.pieceSprite({ shape: 'ball', color: '#FF6B5E', mood: 'wow' }, 96, 96);
  var sprHalfL = COLS.map(function (c) { return F.spritePng(F.slicePath({ color: c, part: 'L' }), 96, 96); });
  var sprHalfR = COLS.map(function (c) { return F.spritePng(F.slicePath({ color: c, part: 'R' }), 96, 96); });
  var sprHalfT = COLS.map(function (c) { return F.spritePng(F.slicePath({ color: c, part: 'T' }), 96, 96); });
  var sprHalfB = COLS.map(function (c) { return F.spritePng(F.slicePath({ color: c, part: 'B' }), 96, 96); });
  var fx = new NW.FX();

  var mode = 'story', lv = 0, paused = false;
  var ents, halves, trail, particles, tLeft, tRun, combo, comboT, maxCombo, cuts, bombWarned, flash, hitstop, spawnI, waveI, won, dead, practice, goal, bombNear, comboStars, waveBanner, perfects;

  var starsStore = NW.store.get('slice_stars', [0,0,0,0,0,0,0,0]);
  if (!Array.isArray(starsStore) || starsStore.length < LEVELS.length) { while (starsStore.length < LEVELS.length) starsStore.push(0); }

  var G = NW.mount({
    key: 'slice', title: '切奶蛙', scoreLabel: '分数', extraCard: '目标',
    rules: '快速滑动切开奶蛙（慢拖无效）。中心切开 PERFECT。45 秒冲目标，8 关挑战。坏奶有红圈警告——别切。冰壳切两次。连斩攒星。',
    onStart: function () { reset(true); }
  });

  function setLvBar() {
    var bar = document.getElementById('lvbar');
    bar.style.display = mode === 'story' ? 'flex' : 'none';
    bar.innerHTML = LEVELS.map(function (L, i) {
      var st = starsStore[i] || 0;
      return '<button type="button" data-lv="' + i + '" class="' + (i === lv ? 'on ' : '') + (st ? 'done' : '') + '">' + (i + 1) + (st ? '★' + st : '') + '</button>';
    }).join('');
    bar.querySelectorAll('button').forEach(function (b) {
      b.onclick = function () { lv = +b.getAttribute('data-lv'); setLvBar(); if (G.running) reset(true); else { G.setExtra(LEVELS[lv].goal); } NW.sfx.click(); };
    });
  }
  document.getElementById('m-story').onclick = function () {
    mode = 'story'; this.classList.add('on'); document.getElementById('m-practice').classList.remove('on'); setLvBar(); NW.sfx.click();
  };
  document.getElementById('m-practice').onclick = function () {
    mode = 'practice'; this.classList.add('on'); document.getElementById('m-story').classList.remove('on'); setLvBar(); NW.sfx.click();
  };
  setLvBar();

  function reset(fromStart) {
    var L = LEVELS[lv];
    practice = mode === 'practice';
    ents = []; halves = []; trail = []; particles = []; comboStars = []; waveBanner = null; perfects = 0;
    tLeft = practice ? 9999 : CFG.DUR; tRun = 0; combo = 0; comboT = 0; maxCombo = 0; cuts = 0;
    bombWarned = false; flash = 0; hitstop = 0; spawnI = 0; waveI = 0; won = false; dead = false; bombNear = 0;
    goal = practice ? 0 : L.goal;
    G.setScore(0, false);
    G.setExtra(practice ? '练习' : ('目标 ' + goal));
    paused = false;
  }

  function bombChance() {
    var L = LEVELS[lv];
    var p = CFG.BOMB_START + (CFG.BOMB_END - CFG.BOMB_START) * Math.min(1, tRun / CFG.DUR);
    return Math.min(0.2, p * (L.bombScale || 1));
  }

  function spawnOne() {
    if (!G.running || dead || won || paused) return;
    var L = LEVELS[lv];
    var isBomb = Math.random() < bombChance() && tRun > 3;
    var ci = (Math.random() * COLS.length) | 0;
    if (L.colorOnly && !isBomb && Math.random() < 0.55) {
      ci = COLS.indexOf(L.colorOnly); if (ci < 0) ci = 0;
    }
    var ice = !isBomb && Math.random() < (L.ice || 0);
    var x = 36 + Math.random() * (W - 72);
    var side = x < W / 2 ? 1 : -1;
    ents.push({
      x: x, y: H + 20 + Math.random() * 30,
      vx: side * (80 + Math.random() * 140),
      vy: -(540 + Math.random() * 180),
      r: isBomb ? 34 : (28 + Math.random() * 10),
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 5,
      ci: ci, bomb: isBomb, ice: ice ? 1 : 0, alive: true, sliced: false, born: 0,
      mustColor: L.colorOnly || null
    });
        if (!isBomb && L.twin && Math.random() < L.twin) {
      var x2 = Math.max(36, Math.min(W - 36, x + side * -55));
      var ci2 = (Math.random() * COLS.length) | 0;
      if (L.colorOnly && Math.random() < 0.55) { ci2 = COLS.indexOf(L.colorOnly); if (ci2 < 0) ci2 = 0; }
      var ice2 = Math.random() < (L.ice || 0);
      ents.push({
        x: x2, y: H + 24 + Math.random() * 20,
        vx: -side * (90 + Math.random() * 120),
        vy: -(520 + Math.random() * 160),
        r: 28 + Math.random() * 10,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 5,
        ci: ci2, bomb: false, ice: ice2 ? 1 : 0, alive: true, sliced: false, born: 0,
        mustColor: L.colorOnly || null
      });
    }
if (isBomb && !bombWarned) {
      bombWarned = true;
      fx.text(W / 2, 100, '坏奶出现 · 别切！', { size: 24, color: '#ff4a4a', life: 1.4 });
      NW.sfx.bad();
    }
  }

  function currentWave() {
    var w = WAVES[0];
    for (var i = 0; i < WAVES.length; i++) if (tRun >= WAVES[i].t) w = WAVES[i];
    return w;
  }

  function starsFor() {
    var s = 1;
    if (tLeft > 12 || perfects >= 3) s++;
    if (maxCombo >= 6) s++;
    if ((tLeft > 18 && maxCombo >= 8) || perfects >= 6) s = 3;
    return Math.min(3, s);
  }

  function winLevel() {
    if (won || practice) return;
    won = true;
    var st = starsFor();
    if (st > (starsStore[lv] || 0)) { starsStore[lv] = st; NW.store.set('slice_stars', starsStore); setLvBar(); }
    NW.sfx.win();
    fx.text(W / 2, 160, '达标！★' + st, { size: 34, color: '#e8a000', life: 1.2 });
    setTimeout(function () { G.over('第' + (lv + 1) + '关过关 · ' + G.score + ' 分 · ★' + st + ' · 连斩' + maxCombo); }, 700);
  }

  function fail(why) {
    if (dead || won) return;
    dead = true; hitstop = RM ? 0.05 : CFG.HITSTOP_BOMB;
    NW.sfx.lose(); if (!RM) flash = 0.5; NW.vib(40);
    setTimeout(function () { G.over((why || '失败') + ' · ' + G.score + ' 分 · 连斩' + maxCombo); }, 650);
  }

  function sliceEntity(e, ang, speed) {
    if (!e.alive || e.sliced) return;
    if (e.bomb) {
      e.sliced = true; e.alive = false;
      fx.burst(e.x, e.y, { count: RM ? 10 : 36, speed: 340, colors: ['#ff4a4a', '#333', '#fff'], size: 8 });
      fail('切到坏奶');
      return;
    }
    // color-only challenge: wrong color still splits but low score?
    if (e.mustColor && COLS[e.ci] !== e.mustColor) {
      // bounce mark — count as miss slice soft
      NW.sfx.whoosh && NW.sfx.whoosh();
      fx.text(e.x, e.y - e.r, '切金色！', { size: 16, color: '#e8a000', life: 0.6 });
      // still allow cut but 1 pt only and no combo
      e.ice = 0;
    }
    if (e.ice > 0) {
      e.ice = 0; hitstop = CFG.HITSTOP;
      NW.sfx.slice && NW.sfx.slice(); NW.vib(8);
      fx.burst(e.x, e.y, { count: 10, speed: 180, colors: ['#cfeeff', '#fff'], size: 5 });
      fx.text(e.x, e.y - e.r, '破冰！', { size: 18, color: '#2a9ad0', life: 0.55 });
      e.vy -= 80; return;
    }
    e.sliced = true; e.alive = false;
    var now = tRun;
    if (now - (comboT || -1) < CFG.COMBO_GAP) combo++; else combo = 1;
    comboT = now; if (combo > maxCombo) maxCombo = combo;
    cuts++;
    var mult = Math.min(5, 1 + Math.floor((combo - 1) / 2));
    var base = (e.mustColor && COLS[e.ci] !== e.mustColor) ? 1 : (12 + ((e.r - 28) | 0));
    // perfect: slash near center of frog
    var perfect = (e._slashDist != null && e._slashDist < e.r * 0.28);
    if (perfect) { base = Math.floor(base * 1.5); perfects++; }
    var pts = base * mult;
    G.setScore(G.score + pts);
    hitstop = combo >= 3 ? CFG.HITSTOP_COMBO : CFG.HITSTOP;
    if (perfect) hitstop = Math.max(hitstop, 0.055);
    NW.sfx.slice && NW.sfx.slice();
    if (combo >= 2) NW.sfx.sliceCombo && NW.sfx.sliceCombo(combo);
    if (perfect) NW.sfx.perfect && NW.sfx.perfect();
    NW.vib(perfect ? 16 : 10);

    var vert = Math.abs(Math.cos(ang || 0)) >= Math.abs(Math.sin(ang || 0));
    var nx = Math.cos(ang || 0), ny = Math.sin(ang || 0);
    halves.push({ x: e.x - nx * 8, y: e.y - ny * 8, vx: e.vx - nx * 160 - 40, vy: e.vy - 110, rot: e.rot, vr: -8, ci: e.ci, life: 1.2, s: e.r / 40, part: vert ? 'L' : 'T' });
    halves.push({ x: e.x + nx * 8, y: e.y + ny * 8, vx: e.vx + nx * 160 + 40, vy: e.vy - 70, rot: e.rot, vr: 8, ci: e.ci, life: 1.2, s: e.r / 40, part: vert ? 'R' : 'B' });
    fx.burst(e.x, e.y, { count: RM ? 5 : (14 + Math.min(14, combo) + (perfect ? 8 : 0)), speed: 260, colors: [COLS[e.ci], '#fff', '#FFD23F'], size: 6 });
    if (fx.ring) fx.ring(e.x, e.y, { maxR: 50 + combo * 3, life: 0.3, color: perfect ? 'rgba(255,210,60,.75)' : COLS[e.ci], line: perfect ? 6 : 4 });
    fx.text(e.x, e.y - e.r - 8, (perfect ? 'PERFECT ' : '') + '+' + pts, { size: 18 + Math.min(12, combo), color: perfect ? '#ff4a2a' : (mult > 1 ? '#ff4a2a' : '#e8a000') });
    if (combo >= 3) fx.text(W / 2, 120, '连斩 ×' + combo, { size: 30, color: '#ff8a00', life: 0.7 });
    if (combo >= 5 && !RM) flash = Math.max(flash, 0.14);
    if (combo >= 8 && fx.ring) fx.ring(e.x, e.y, { maxR: 96, life: 0.4, color: 'rgba(255,200,40,.75)', line: 6 });
    // combo star flies to top HUD
    if (combo >= 2) {
      comboStars.push({ x: e.x, y: e.y, tx: W / 2, ty: 88, life: 0.55, n: combo });
    }
    for (var p = 0; p < (RM ? 3 : 12); p++) {
      var a = Math.random() * 6.28;
      particles.push({ x: e.x, y: e.y, vx: Math.cos(a) * (90 + Math.random() * 180), vy: Math.sin(a) * (90 + Math.random() * 180) - 70, life: 0.45 + Math.random() * 0.25, c: COLS[e.ci], s: 3 + Math.random() * 4 });
    }
    if (!practice && G.score >= goal) winLevel();
  }

  function resize() { NW.fit(cv, box, W / H, 480); view.s = cv.width / W; }
  window.addEventListener('resize', resize); resize();

  var drawing = false, lastP = null, lastT = 0;
  function pt(e) {
    var r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) / view.s, y: (e.clientY - r.top) / view.s, t: performance.now() };
  }
  function onDown(e) {
    if (e.target && e.target.closest && e.target.closest('.nw-modal,.nw-top,button,a,.sl-lv,.sl-modes')) return;
    if (!G.running || paused) return;
    drawing = true; lastP = pt(e); lastT = lastP.t;
    trail.push({ x: lastP.x, y: lastP.y, life: CFG.TRAIL_MS / 1000 });
    try { box.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function onMove(e) {
    if (!drawing || !G.running || dead || won || paused) return;
    var p = pt(e); if (!lastP) { lastP = p; return; }
    var dx = p.x - lastP.x, dy = p.y - lastP.y, dist = Math.hypot(dx, dy);
    var dtMs = Math.max(8, p.t - lastP.t);
    var speed = dist / (dtMs / 1000); // px/s in game space roughly
    // scale by view — already in game coords
    if (dist < 2) return;
    var thick = 3 + (combo >= 3 ? 2 : 0) + (combo >= 7 ? 3 : 0);
    var steps = Math.max(1, Math.min(10, (dist / 6) | 0));
    for (var s = 1; s <= steps; s++) {
      var t = s / steps;
      var x = lastP.x + dx * t, y = lastP.y + dy * t;
      trail.push({ x: x, y: y, life: (RM ? 0.06 : CFG.TRAIL_MS / 1000), thick: thick, gold: combo >= 4 });
      if (speed >= CFG.SLASH_MIN) {
        for (var i = 0; i < ents.length; i++) {
          var en = ents[i];
          if (!en.alive || en.sliced) continue;
          var dHit = Math.hypot(en.x - x, en.y - y);
          if (dHit < en.r + 10) { en._slashDist = dHit; sliceEntity(en, Math.atan2(dy, dx), speed); }
          else if (en.bomb && Math.hypot(en.x - x, en.y - y) < en.r + 36) bombNear = 0.4;
        }
      }
    }
    if (speed < CFG.SLASH_MIN && dist > 20) NW.sfx.whoosh && NW.sfx.whoosh();
    lastP = p;
  }
  function onUp() { drawing = false; lastP = null; }
  box.addEventListener('pointerdown', onDown);
  box.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); if (!G.running) return; paused = !paused; NW.sfx.click(); }
  });

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (flash > 0) flash -= dt;
    if (bombNear > 0) bombNear -= dt;
    if (hitstop > 0) { hitstop -= dt; draw(); fx.draw(ctx); requestAnimationFrame(frame); return; }

    if (G.running && !dead && !won && !paused) {
      tRun += dt;
      if (!practice) {
        tLeft -= dt;
        if (tLeft <= 0) { tLeft = 0; fail('时间到'); }
      }
      var dens = LEVELS[lv].dens || 1;
      var w = currentWave();
      var wi = WAVES.indexOf(w);
      if (wi !== waveI) {
        waveI = wi;
        waveBanner = { t: 1.1, text: '波次 ' + (wi + 1) + ' · 同屏×' + w.n };
        NW.sfx.click();
      }
      spawnI += dt;
      var interval = (w.gap / 1000) / dens;
      if (spawnI >= interval) {
        spawnI = 0;
        var n = w.n;
        for (var i = 0; i < n; i++) setTimeout(spawnOne, i * 70);
      }

      for (var i = ents.length - 1; i >= 0; i--) {
        var e = ents[i];
        e.born = Math.min(1, e.born + dt * 5);
        e.vy += CFG.GRAV * dt; e.x += e.vx * dt; e.y += e.vy * dt; e.rot += e.vr * dt;
        e.vx *= 1 - dt * 0.12;
        if (e.y > H + 90) {
          if (e.alive && !e.sliced && !e.bomb) {
            // missed — soft penalty in story: lose a bit of time feel via combo break
            combo = 0;
          }
          ents.splice(i, 1);
        } else if (e.sliced) ents.splice(i, 1);
      }
    }

    for (var h = halves.length - 1; h >= 0; h--) {
      var ha = halves[h];
      ha.vy += CFG.GRAV * dt; ha.x += ha.vx * dt; ha.y += ha.vy * dt; ha.rot += ha.vr * dt; ha.life -= dt;
      if (ha.life <= 0 || ha.y > H + 60) halves.splice(h, 1);
    }
    for (var tr = trail.length - 1; tr >= 0; tr--) { trail[tr].life -= dt; if (trail[tr].life <= 0) trail.splice(tr, 1); }
    for (var p = particles.length - 1; p >= 0; p--) {
      var q = particles[p]; q.vy += 600 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt;
      if (q.life <= 0) particles.splice(p, 1);
    }
    for (var cs = comboStars.length - 1; cs >= 0; cs--) {
      var s = comboStars[cs]; var k = Math.min(1, 1 - s.life / 0.55);
      s.x += (s.tx - s.x) * Math.min(1, dt * 8); s.y += (s.ty - s.y) * Math.min(1, dt * 8);
      s.life -= dt; if (s.life <= 0) comboStars.splice(cs, 1);
    }
    if (waveBanner) { waveBanner.t -= dt; if (waveBanner.t <= 0) waveBanner = null; }

    draw(); fx.draw(ctx); requestAnimationFrame(frame);
  }

  function roundRect(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  function draw() {
    var c = ctx;
    c.setTransform(view.s, 0, 0, view.s, 0, 0);
    var g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#b4e4ff'); g.addColorStop(0.5, '#eef9ff'); g.addColorStop(1, '#dff3b0');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.fillStyle = 'rgba(200,160,80,.16)'; c.fillRect(0, H - 64, W, 64);

    // timer ring
    if (G.running && !practice) {
      var pct = tLeft / CFG.DUR;
      c.beginPath(); c.arc(W / 2, 36, 22, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct);
      c.strokeStyle = pct < 0.2 ? '#ff4a4a' : '#F7C32B'; c.lineWidth = 5; c.stroke();
      c.fillStyle = '#6a4400'; c.font = 'bold 12px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(Math.ceil(tLeft) + 's', W / 2, 36);
      // goal bar
      var gp = Math.min(1, G.score / Math.max(1, goal));
      c.fillStyle = 'rgba(255,255,255,.75)'; roundRect(c, 40, 62, W - 80, 12, 6); c.fill();
      c.fillStyle = '#8FD14F'; roundRect(c, 40, 62, (W - 80) * gp, 12, 6); c.fill();
      c.fillStyle = '#6a4400'; c.font = 'bold 10px system-ui'; c.fillText(G.score + ' / ' + goal, W / 2, 68);
    }

    halves.forEach(function (ha) {
      c.save(); c.globalAlpha = Math.max(0, ha.life); c.translate(ha.x, ha.y); c.rotate(ha.rot * 0.35);
      var pack = { L: sprHalfL, R: sprHalfR, T: sprHalfT, B: sprHalfB }[ha.part] || sprHalfL;
      var im = pack[ha.ci]; var sz = 88 * ha.s;
      if (im && im.width) c.drawImage(im, -sz / 2, -sz / 2, sz, sz);
      c.restore();
    });

    ents.forEach(function (e) {
      if (!e.alive && e.sliced) return;
      c.save(); c.translate(e.x, e.y); c.rotate(e.rot); c.scale(0.7 + 0.3 * e.born, 0.7 + 0.3 * e.born);
      c.fillStyle = 'rgba(0,0,0,.12)'; c.beginPath(); c.ellipse(0, e.r * 0.85, e.r * 0.7, e.r * 0.2, 0, 0, 6.28); c.fill();
      var im = e.bomb ? sprBomb : sprBall[e.ci];
      var sz = e.r * 2.15;
      if (im && im.width) c.drawImage(im, -sz / 2, -sz / 2, sz, sz);
      if (e.ice) {
        c.strokeStyle = 'rgba(180,230,255,.85)'; c.lineWidth = 4;
        c.beginPath(); c.arc(0, 0, e.r + 4, 0, 6.28); c.stroke();
        c.fillStyle = 'rgba(200,240,255,.25)'; c.beginPath(); c.arc(0, 0, e.r + 2, 0, 6.28); c.fill();
      }
      if (e.bomb) {
        // telegraph as soon as bomb is on screen
        var warn = e.y < H + 40;
        if (warn) {
          var pulse = 0.45 + 0.35 * Math.sin(tRun * 14);
          c.strokeStyle = 'rgba(255,40,40,' + pulse + ')'; c.lineWidth = 4;
          c.beginPath(); c.arc(0, 0, e.r + 10 + Math.sin(tRun * 10) * 3, 0, 6.28); c.stroke();
          c.fillStyle = 'rgba(255,40,40,' + (pulse * 0.25) + ')'; c.beginPath(); c.arc(0, 0, e.r + 8, 0, 6.28); c.fill();
          c.fillStyle = '#ff3030'; c.font = 'bold 11px system-ui'; c.textAlign = 'center';
          c.fillText('别切!', 0, -e.r - 18);
        }
        c.strokeStyle = '#333'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, -e.r + 4); c.quadraticCurveTo(10, -e.r - 14, 16, -e.r - 8); c.stroke();
        c.fillStyle = '#ff8a00'; c.beginPath(); c.arc(16, -e.r - 8, 4 + Math.sin(tRun * 18) * 1.5, 0, 6.28); c.fill();
      }
      if (e.mustColor && COLS[e.ci] === e.mustColor) {
        c.strokeStyle = 'rgba(255,200,40,.7)'; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, e.r + 6, 0, 6.28); c.stroke();
      }
      c.restore();
    });

    particles.forEach(function (q) {
      c.globalAlpha = Math.max(0, q.life * 2); c.fillStyle = q.c;
      c.beginPath(); c.arc(q.x, q.y, q.s, 0, 6.28); c.fill(); c.globalAlpha = 1;
    });

    if (trail.length > 1) {
      c.lineCap = 'round'; c.lineJoin = 'round';
      for (var i = 1; i < trail.length; i++) {
        var a = trail[i - 1], b = trail[i];
        var life = Math.min(a.life, b.life);
        var th = (a.thick || 4) * (RM ? 0.6 : 1);
        c.strokeStyle = 'rgba(255,255,255,' + (life * 2.4) + ')'; c.lineWidth = th + life * 8;
        c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
        c.strokeStyle = (a.gold ? 'rgba(255,210,60,' : 'rgba(255,230,140,') + (life * 1.5) + ')';
        c.lineWidth = 1 + life * 4; c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
      }
    }

    if (flash > 0 && !RM) { c.fillStyle = 'rgba(255,60,60,' + (flash * 0.4) + ')'; c.fillRect(0, 0, W, H); }
    if (paused) {
      c.fillStyle = 'rgba(255,255,255,.55)'; c.fillRect(0, 0, W, H);
      c.fillStyle = '#6a4400'; c.font = 'bold 28px system-ui'; c.textAlign = 'center'; c.fillText('暂停', W / 2, H / 2);
    }
    comboStars.forEach(function (s) {
      c.save(); c.globalAlpha = Math.max(0, s.life * 2);
      c.fillStyle = '#FFD23F'; c.font = 'bold 22px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('★', s.x, s.y);
      c.restore();
    });
    if (waveBanner) {
      c.globalAlpha = Math.min(1, waveBanner.t * 2);
      c.fillStyle = 'rgba(255,255,255,.85)'; roundRect(c, W / 2 - 100, 96, 200, 36, 14); c.fill();
      c.fillStyle = '#3a6a90'; c.font = 'bold 16px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(waveBanner.text, W / 2, 114); c.globalAlpha = 1;
    }
    if (G.running && combo >= 2) {
      c.fillStyle = 'rgba(255,255,255,.8)'; roundRect(c, W / 2 - 70, H - 44, 140, 34, 16); c.fill();
      c.fillStyle = '#ff6a00'; c.font = 'bold 15px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('连斩 ×' + combo + '  ★'.repeat(Math.min(5, combo)), W / 2, H - 27);
    }
  }

  G.setExtra(LEVELS[0].goal);
  requestAnimationFrame(frame);
})();
</script>
