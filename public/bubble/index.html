<script>
(function () {
var G = NW.mount({ key: 'bubble', title: '泡泡奶蛙', extraCard: '发射', rules: '按住屏幕瞄准，松手发射蛙头泡泡。三个同色相连消除，悬空的跟着掉落。别让泡泡压到底线！', onStart: function(){ if (window.__start) window.__start(); } });
var W = 360, H = 600, S = NWK.stage({ W: W, H: H }), E = NWK.ease, R0 = NWK.rand, TAU = Math.PI * 2, fx = S.fx;
var R = 18, RH = R * Math.sqrt(3), TOP = 52, LINE = 478, SX = W / 2, SY = 536, MAXR = 17;
var COLS = ['#F7C32B', '#8FD14F', '#FF7BAC', '#5CC8F2', '#B28DFF', '#FF9F43'];
NWK.preload(COLS, ['neutral', 'laugh']);
var cells, par, ball, cur, nxt, aim, aiming, level, ncol, shots, limit, falling, pops, lost, combo, recoil, hint, descend, waitT;
function off(r) { return (r + par) % 2; }

}

});

}

  return best;
}
function attach(x, y) {

  var b = mkb(ball.color); b.sc = 1.25; cells[r][c] = b; shots++; NW.sfx.drop(); NW.vib(6);

  var popped = 0;
  if (grp.length >= 3) {
    combo++; grp.forEach(function (q) { var o = cells[q[0]][q[1]], d = Math.hypot(cx(q[0], q[1]) - cx(r, c), cy(q[0]) - cy(r)); pops.push({ b: o, x: cx(q[0], q[1]), y: cy(q[0]), t: -d / 700, color: o.color, dir: 0 }); cells[q[0]][q[1]] = null; });
    popped = grp.length; var pts = grp.length * 10 * (grp.length - 2); G.setScore(G.score + pts); fx.text(cx(r, c), cy(r) - 20, '+' + pts, { size: 20 + Math.min(14, grp.length * 2), color: '#e8a000' });
    NW.sfx.pop(Math.min(10, grp.length)); NW.vib([8]); S.shake(2 + grp.length); S.freeze(grp.length >= 5 ? 60 : 30);
    if (combo > 1) fx.text(W / 2, 220, '连消 ×' + combo, { size: 28, color: '#ff4a2a', life: 1 });
    var fl = floaters(); if (fl.length) { var bonus = 0; fl.forEach(function (q, i) { var o = cells[q[0]][q[1]]; cells[q[0]][q[1]] = null; falling.push({ b: o, x: cx(q[0], q[1]), y: cy(q[0]), vx: R0(-60, 60), vy: -R0(60, 220), rot: 0, vr: R0(-6, 6), delay: i * .03, color: o.color }); bonus += 20 * (i + 1) > 400 ? 400 : 20 * (i + 1); }); G.setScore(G.score + bonus); fx.text(W / 2, 260, '掉落 ' + fl.length + '！+' + bonus, { size: 30, color: '#3F8E1C', life: 1.1 }); NW.sfx.combo(Math.min(6, 2 + fl.length / 3)); S.shake(8); }

function floaters() {
  var seen = {}, st = []; if (!cells.length) return [];
  for (var c = 0; c < cells[0].length; c++) if (cells[0][c]) { seen['0,' + c] = 1; st.push([0, c]); }
  while (st.length) { var q = st.pop(); nbrs(q[0], q[1]).forEach(function (n) { var k = n[0] + ',' + n[1]; if (cells[n[0]] && cells[n[0]][n[1]] && !seen[k]) { seen[k] = 1; st.push(n); } }); }
  var out = []; for (var r = 0; r < cells.length; r++) for (c = 0; c < cells[r].length; c++) if (cells[r][c] && !seen[r + ',' + c]) out.push([r, c]); return out;
}
function trim() { while (cells.length && cells[cells.length - 1].every(function (b) { return !b; })) cells.pop(); }
function checkEnd(popped) {
  var total = 0; cells.forEach(function (row) { row.forEach(function (b) { if (b) total++; }); });
  if (!total) { levelUp(); return; }
  if (!popped && shots >= limit) { pushRow(); shots = 0; }
  G.setExtra(Math.max(0, limit - shots));
  for (var r = 0; r < cells.length; r++) for (var c = 0; c < cells[r].length; c++) if (cells[r][c] && cy(r) + R > LINE) { gameOver(); return; }
}
function pushRow() {
  par ^= 1; var a = rowArr(0); for (var c = 0; c < a.length; c++) { var b = mkb(Math.floor(Math.random() * ncol)); b.sc = 0.2; a[c] = b; } cells.unshift(a); NW.sfx.bad(); S.shake(7); NW.vib([14, 30, 14]); fx.text(W / 2, 110, '泡泡下降！', { size: 24, color: '#ff5a5a', life: .9 });
  cells.forEach(function (row) { row.forEach(function (b) { if (b) b.oy -= RH; }); });
}
function levelUp() { NW.sfx.win(); S.shake(8); var b = 200 + level * 50; G.setScore(G.score + b); fx.text(W / 2, 250, '清屏！+' + b, { size: 36, color: '#ff4a2a', life: 1.4 }); fx.burst(W / 2, 250, { count: 40, speed: 420, size: 9 }); lost = true; setTimeout(function () { start(level + 1); }, 1300); }
function gameOver() { if (lost) return; lost = true; NW.vib([30, 40, 60]); S.shake(14); cells.forEach(function (row, r) { row.forEach(function (b, c) { if (b) falling.push({ b: b, x: cx(r, c), y: cy(r), vx: R0(-80, 80), vy: -R0(40, 200), rot: 0, vr: R0(-6, 6), delay: r * .04, color: b.color }); }); }); cells.forEach(function (row, r) { for (var c = 0; c < row.length; c++) row[c] = null; }); setTimeout(function () { G.over('清掉了第 ' + level + ' 关的一部分'); }, 700); }
function update(dt, rdt) {
  if (recoil > 0) recoil = Math.max(0, recoil - rdt * 5);
  cells.forEach(function (row) { row.forEach(function (b) { if (!b) return; b.born = Math.min(1, b.born + rdt * 4); b.sc += (1 - b.sc) * Math.min(1, dt * 12); b.vx += (-b.ox * 260 - b.vx * 12) * dt; b.vy += (-b.oy * 260 - b.vy * 12) * dt; b.ox += b.vx * dt; b.oy += b.vy * dt; }); });
  for (var i = pops.length - 1; i >= 0; i--) { var p = pops[i]; p.t += dt; if (p.t > 0 && !p.did) { p.did = 1; fx.burst(p.x, p.y, { count: 7, speed: 230, size: 6, colors: [COLS[p.color], '#fff'], gravity: 700 }); } if (p.t > .18) pops.splice(i, 1); }
  for (i = falling.length - 1; i >= 0; i--) { var f = falling[i]; if (f.delay > 0) { f.delay -= dt; continue; } f.vy += 1500 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt; if (f.y > H + 40) falling.splice(i, 1); }
  if (ball) {
    var n = Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / 5), sd = dt / n, done = false;
    for (var s = 0; s < n && !done; s++) {
      ball.x += ball.vx * sd; ball.y += ball.vy * sd;
      if (ball.x < R) { ball.x = R; ball.vx = Math.abs(ball.vx); NW.sfx.swap(); } if (ball.x > W - R) { ball.x = W - R; ball.vx = -Math.abs(ball.vx); NW.sfx.swap(); }
      if (ball.y <= TOP + R) { attach(ball.x, TOP + R); done = true; break; }
      for (var r = 0; r < cells.length && !done; r++) for (var c = 0; c < cells[r].length; c++) { var b = cells[r][c]; if (b && Math.hypot(cx(r, c) + b.ox - ball.x, cy(r) + b.oy - ball.y) < R * 1.8) { attach(ball.x, ball.y); done = true; break; } }
    }

  }
}
function orb(c, x, y, color, sc, face) {

}
function draw(c) {

  c.fillStyle = 'rgba(255,255,255,.45)'; NWK.rr(c, 4, TOP - 2, W - 8, LINE - TOP + 18, 14); c.fill();
  c.setLineDash([8, 6]); c.strokeStyle = 'rgba(255,90,90,.8)'; c.lineWidth = 2; c.beginPath(); c.moveTo(8, LINE + 6); c.lineTo(W - 8, LINE + 6); c.stroke(); c.setLineDash([]);
  c.font = '900 16px sans-serif'; c.textBaseline = 'middle'; c.textAlign = 'left'; c.fillStyle = '#2a7a9a'; c.fillText('第 ' + level + ' 关', 14, 26); c.textAlign = 'right'; c.fillStyle = shots >= limit - 1 ? '#ff4a2a' : '#7a5a00'; c.fillText('再 ' + Math.max(0, limit - shots) + ' 发下降', W - 14, 26);
  cells.forEach(function (row, r) { row.forEach(function (b, ci) { if (!b || b.born <= 0) return; orb(c, cx(r, ci) + b.ox, cy(r) + b.oy, b.color, E.outBack(b.born) * b.sc * (b.born < 1 ? 1 : 1)); }); });
  pops.forEach(function (p) { if (p.t < 0) { orb(c, p.x, p.y, p.color, 1); return; } var k = p.t / .18; c.globalAlpha = 1 - k; orb(c, p.x, p.y, p.color, 1 + k * .5, 'laugh'); c.globalAlpha = 1; });

}
S.run(update, draw);
window.__g = { S: S, G: G, dbg: { cells: function () { return cells; }, aimAt: function (x, y) { setAim(x, y); }, fire: function () { if (!ball && !lost) fire(); }, cur: function () { return cur; }, ball: function () { return ball; }, pos: function (r, c) { return [cx(r, c), cy(r)]; }, nbrs: nbrs, snap: snap } };

})();
