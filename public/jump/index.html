</div>
<script src="/assets/frog.js?v=model3"></script><script src="/assets/nw.js?v=model3"></script>
<script>
(function () {

  var PC = [['#FDB91A', '#C88E10'], ['#5CC8F2', '#3A9FCC'], ['#FF9F43', '#D97A1C'], ['#FF7BAC', '#D95A8A'], ['#B28DFF', '#8B66D9'], ['#8FD14F', '#6BAE2E'], ['#E8F0FF', '#AFC3D9']];
  var fx = new NW.FX(), plats, frog, cam, camT, camDip = 0, charge, charging, combo, shakeT, state, clouds = [], airTime = 0.46, jumps = 0, chargeSfxT = 0, coins = [], milk = 0;
  var G = NW.mount({ key: 'jump', title: '奶蛙跳一跳', scoreLabel: '分数', extraCard: '奶币', rules: '按住蓄力（满约 1.05 秒）、松手起跳。虚线预判：灰=能踩、红=踩空。完美=落点在中心 17% 内。平台：方块/圆柱/移动/弹簧/冰面；难度按跳数爬升；落地有涟漪，空中偶有奶币。', onStart: reset });

            var half = q.kind === 1 ? q.w * 0.42 : q.w / 2;

      if (camDip > 0) camDip = Math.max(0, camDip - dt * 1.8);
      plats.forEach(function (p) { p.sq += (0 - p.sq) * Math.min(1, dt * 9); p.born = Math.min(1, p.born + dt * 3); });
    }

  }
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function drawPlat(c, p) {

      c.fillStyle = g; c.beginPath(); c.ellipse(0, h / 2, w / 2, h / 2, 0, 0, 7); c.fill();
      c.fillStyle = col[0]; c.beginPath(); c.ellipse(0, 0, w / 2, h * .35, 0, 0, 7); c.fill();

      c.fillStyle = col[0]; rr(c, -w / 2, -2, w, h - 4, 11); c.fill();
      c.fillStyle = 'rgba(255,255,255,.35)'; rr(c, -w / 2 + 5, 0, w - 10, 6, 3); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 2; c.beginPath(); c.ellipse(0, 6, 10, 3.5, 0, 0, 7); c.stroke();
      if (p.kind === 3) {
        c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.moveTo(-10, 10); c.lineTo(0, 18); c.lineTo(10, 10); c.stroke();
        c.fillStyle = 'rgba(124,201,62,.35)'; rr(c, -w / 2, -2, w, h - 4, 11); c.fill();
      }
      if (p.kind === 4) {
        c.fillStyle = 'rgba(255,255,255,.55)'; rr(c, -w / 2 + 4, 0, w - 8, 8, 4); c.fill();
        c.strokeStyle = 'rgba(180,220,255,.9)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-w / 4, 6); c.lineTo(-w / 8, 2); c.lineTo(0, 8); c.lineTo(w / 8, 1); c.lineTo(w / 4, 7); c.stroke();
      }
      if (p.kind === 2) {
        c.fillStyle = 'rgba(255,255,255,.7)'; c.fillRect(-6, h + 2, 12, 3);
        c.fillStyle = col[1]; c.beginPath(); c.moveTo(-10, h + 3); c.lineTo(-4, h - 2); c.lineTo(-4, h + 8); c.fill();
        c.beginPath(); c.moveTo(10, h + 3); c.lineTo(4, h - 2); c.lineTo(4, h + 8); c.fill();

  }
  function draw(t) {
    var c = ctx; c.setTransform(view.s, 0, 0, view.s, 0, 0); c.clearRect(0, 0, W, H); c.save();
    if (shakeT > 0) { shakeT -= .016; c.translate((Math.random() - .5) * 12 * shakeT * 4, (Math.random() - .5) * 12 * shakeT * 4); }
    c.save(); if (camDip > 0) c.translate(0, camDip * 40); rr(c, 0, 0, W, H, 22); c.clip();

})();
