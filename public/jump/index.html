<script src="/assets/frog.js?v=snd1"></script><script src="/assets/nw.js?v=snd1"></script>
<script>
(function () {

  function plat(x, y, w, ci) { return { x: x, y: y, w: w, h: 26, ci: ci, sq: 0, born: 0 }; }
  function nextPlat(prev) { var n = Math.min(45, plats.length + (G.score || 0)) / 45, gap = 60 + n * 24 + Math.random() * (80 + n * 30), w = (78 + Math.random() * 46) * (1 - .3 * n), dir = Math.random() < .5 ? -1 : 1; var nx = prev.x + dir * (prev.w / 2 + gap + w / 2); if (nx < w / 2 + 14) nx = prev.x + (prev.w / 2 + gap + w / 2); if (nx > W - w / 2 - 14) nx = prev.x - (prev.w / 2 + gap + w / 2); nx = Math.max(w / 2 + 12, Math.min(W - w / 2 - 12, nx)); var p = plat(nx, prev.y - (62 + Math.random() * 18), w, (prev.ci + 1 + Math.floor(Math.random() * 4)) % PC.length); p.born = 0; return p; }

        }

    }

  }
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function drawPlat(c, p) {
    var y = p.y + cam, w = p.w, h = p.h, col = PC[p.ci], sq = 1 - p.sq * .12, drop = (1 - p.born) * -120;
    c.save(); c.translate(p.x, y + drop); c.scale(1, sq); c.globalAlpha = p.born; c.fillStyle = 'rgba(40,80,120,.18)'; c.beginPath(); c.ellipse(0, h + 6, w / 2 + 6, 8, 0, 0, 7); c.fill();
    var g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, col[1]); g.addColorStop(1, col[1]); c.fillStyle = g; rr(c, -w / 2, 4, w, h, 11); c.fill();
    var g2 = c.createLinearGradient(0, -6, 0, 18); g2.addColorStop(0, col[0]); g2.addColorStop(1, col[0]); c.fillStyle = g2; rr(c, -w / 2, -2, w, h - 4, 11); c.fill();
    c.fillStyle = 'rgba(255,255,255,.35)'; rr(c, -w / 2 + 5, 0, w - 10, 6, 3); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 2; c.beginPath(); c.ellipse(0, 6, 10, 3.5, 0, 0, 7); c.stroke();
    c.restore();
  }
  function draw(t) {
    var c = ctx; c.setTransform(view.s, 0, 0, view.s, 0, 0); c.clearRect(0, 0, W, H); c.save();
    if (shakeT > 0) { shakeT -= .016; c.translate((Math.random() - .5) * 12 * shakeT * 4, (Math.random() - .5) * 12 * shakeT * 4); }
    c.save(); rr(c, 0, 0, W, H, 22); c.clip(); var bg = c.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#8FC3EA'); bg.addColorStop(.55, '#BCDAF2'); bg.addColorStop(1, '#E3EFF9'); c.fillStyle = bg; c.fillRect(0, 0, W, H);
    clouds.forEach(function (cl) { var y = ((cl.y + cam * .35) % 1000 + 1000) % 1000 - 200; c.fillStyle = 'rgba(255,255,255,.75)'; c.beginPath(); c.ellipse(cl.x, y, 38 * cl.s, 14 * cl.s, 0, 0, 7); c.ellipse(cl.x - 24 * cl.s, y + 5, 22 * cl.s, 10 * cl.s, 0, 0, 7); c.ellipse(cl.x + 26 * cl.s, y + 4, 26 * cl.s, 11 * cl.s, 0, 0, 7); c.fill(); });
    if (plats) {

      // charge aura

      if (charging) { var pw = Math.min(1, charge / 1.05); c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.arc(frog.x, fy - 40, 46, -Math.PI / 2, -Math.PI / 2 + pw * 6.28); c.stroke(); c.strokeStyle = pw > .85 ? '#ff6b3a' : '#7CC93E'; c.lineWidth = 3; c.beginPath(); c.arc(frog.x, fy - 40, 46, -Math.PI / 2, -Math.PI / 2 + pw * 6.28); c.stroke(); }
