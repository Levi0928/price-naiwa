<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd54a">
<title>作者 · 奶蛙小游戏</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">← 返回合集</a>
    <div class="panel">
      <div style="width:72px;height:86px;margin-bottom:8px" aria-hidden="true">
        <img src="/assets/frog.svg" alt="" width="72" height="86" style="width:100%;height:100%;object-fit:contain">
      </div>
      <h1>作者页</h1>
      <p style="margin:0 0 8px;color:var(--muted)">作者信息稍后填写。下面先留空壳，Levi 之后按自己的来填。</p>

      <div class="slot">
        <strong>姓名 / 昵称</strong>
        （待填写）
      </div>
      <div class="slot">
        <strong>简介</strong>
        （待填写）
      </div>
      <div class="slot">
        <strong>联系方式</strong>
        （待填写：邮箱 / 社交账号 / 主页链接）
      </div>

      <p style="margin:16px 0 0;font-size:.85rem;color:var(--muted)">本合集游戏均为自研前端作品，与其他网站无关。</p>
      <p style="margin:12px 0 0">
        <a class="btn" href="/">回游戏列表</a>
        <a class="btn ghost" href="/" style="margin-left:8px">首页</a>
      </p>
    </div>
  </div>
</body>
</html>
