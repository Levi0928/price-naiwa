<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#bfeaff">
<title>奶蛙 2048 · 奶蛙小游戏</title>
<meta name="description" content="滑动合并相同的奶蛙，冲击 2048！奶蛙小游戏之奶蛙 2048。">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:title" content="奶蛙 2048 · 奶蛙小游戏"><meta property="og:description" content="滑动合并相同的奶蛙，冲击 2048！奶蛙小游戏之奶蛙 2048。"><meta property="og:image" content="https://price-naiwa.onrender.com/assets/og.png">
<link rel="stylesheet" href="/style.css">
<style>
.board { position: relative; width: min(100%, 440px); aspect-ratio: 1; border-radius: 24px; padding: 2.8%; background: linear-gradient(180deg, #d99a12, #c98a07); box-shadow: 0 8px 0 #9a6700, 0 18px 30px rgba(120, 80, 0, .3), inset 0 3px 0 rgba(255, 255, 255, .3); touch-action: none; }
.cells, .tiles { position: absolute; inset: 2.8%; }
.cell { position: absolute; width: 22.4%; height: 22.4%; border-radius: 16%; background: rgba(255, 240, 190, .32); box-shadow: inset 0 3px 6px rgba(120, 70, 0, .35); }
.tile { position: absolute; width: 22.4%; height: 22.4%; transition: transform .12s cubic-bezier(.3, .9, .4, 1); will-change: transform; }
.tile > div { position: absolute; inset: 0; border-radius: 16%; display: grid; place-items: center; font-weight: 900; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .18); overflow: hidden; box-shadow: inset 0 4px 0 rgba(255, 255, 255, .5), inset 0 -5px 0 rgba(0, 0, 0, .12), 0 4px 0 rgba(0, 0, 0, .18); }
.tile > div img { position: absolute; left: 50%; top: 30%; width: 50%; transform: translate(-50%, -50%); opacity: .9; }
.tile > div span { position: relative; z-index: 2; line-height: 1; transform: translateY(26%); }
.tile.new > div { animation: tnew .2s cubic-bezier(.3, 1.7, .5, 1); }
.tile.merged > div { animation: tmerge .22s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes tnew { from { transform: scale(0); } }
@keyframes tmerge { 0% { transform: scale(1); } 50% { transform: scale(1.22); } 100% { transform: scale(1); } }
</style>
</head>
<body class="game">
<div class="nw-game">
  <div id="nw-top"></div><div id="nw-hud"></div>
  <main class="nw-stage"><div class="board" id="board"><div class="cells" id="cells"></div><div class="tiles" id="tiles"></div></div></main>
  <p class="nw-hint">上下左右滑动，相同的奶蛙会合并</p>
</div>
<script src="/assets/frog.js"></script><script src="/assets/nw.js"></script>
<script>
(function () {
  var F = NaiwaFrog, N = 4, grid, tiles, uid = 0, busy = false, won = false, keepGoing = false;
  var COL = { 2: ['#fff1c2', '#8a6a20', '#F7C32B'], 4: ['#ffe38a', '#8a6a20', '#F7C32B'], 8: ['#ffb86a', '#fff', '#FF9F43'], 16: ['#ff9a5a', '#fff', '#FF9F43'], 32: ['#ff7a5a', '#fff', '#FF6B5E'], 64: ['#ff5a6a', '#fff', '#FF7BAC'], 128: ['#8fd14f', '#fff', '#8FD14F'], 256: ['#3ed3b5', '#fff', '#3ED3B5'], 512: ['#5cc8f2', '#fff', '#5CC8F2'], 1024: ['#b28dff', '#fff', '#B28DFF'], 2048: ['#ffd23f', '#fff', '#F7C32B'] };
  var faces = {}; function face(v) { if (!faces[v]) { var c = COL[v] || COL[2048]; faces[v] = F.url(F.ball({ color: c[2], mood: v >= 128 ? 'laugh' : (v >= 16 ? 'wow' : 'neutral'), crown: v >= 2048 })); } return faces[v]; }
  var boardEl = document.getElementById('board'), cellsEl = document.getElementById('cells'), tilesEl = document.getElementById('tiles');
  for (var i = 0; i < 16; i++) { var d = document.createElement('div'); d.className = 'cell'; d.style.left = (i % 4) * 25.6 + '%'; d.style.top = Math.floor(i / 4) * 25.6 + '%'; cellsEl.appendChild(d); }
  var fx = new NW.FX(), ov = NW.overlay(boardEl);
  var G = NW.mount({ key: 'g2048', title: '奶蛙 2048', rules: '上下左右滑动，相同数字的奶蛙会合并。合出 2048 就赢啦，之后还能继续冲！', onStart: reset });
  function reset() { grid = []; for (var r = 0; r < N; r++) { grid.push([null, null, null, null]); } tilesEl.innerHTML = ''; won = false; keepGoing = false; busy = false; G.setScore(0, false); add(); add(); }
  function empties() { var e = []; for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (!grid[r][c]) e.push([r, c]); return e; }
  function add() { var e = empties(); if (!e.length) return; var p = e[Math.floor(Math.random() * e.length)]; make(p[0], p[1], Math.random() < .9 ? 2 : 4, 'new'); }
  function make(r, c, v, cls) {
    var t = { id: ++uid, v: v, r: r, c: c, el: document.createElement('div') }; t.el.className = 'tile ' + (cls || ''); t.el.innerHTML = '<div><img alt="" src="' + face(v) + '"><span></span></div>'; grid[r][c] = t; paint(t); tilesEl.appendChild(t.el); return t;
  }
  function paint(t) {
    var col = COL[t.v] || COL[2048], d = t.el.firstChild; d.style.background = 'linear-gradient(180deg,' + lighten(col[0]) + ',' + col[0] + ')'; d.style.color = col[1]; d.querySelector('img').src = face(t.v);
    var s = d.querySelector('span'); s.textContent = t.v; var len = String(t.v).length; var w = boardEl.clientWidth * .224; s.style.fontSize = (w * (len <= 2 ? .42 : len === 3 ? .34 : .27)) + 'px'; 
    t.el.style.transform = 'translate(' + t.c * 114.3 + '%,' + t.r * 114.3 + '%)';
  }
  function lighten(h) { var n = parseInt(h.slice(1), 16), r = n >> 16, g = n >> 8 & 255, b = n & 255; return 'rgb(' + Math.min(255, r + 28) + ',' + Math.min(255, g + 28) + ',' + Math.min(255, b + 28) + ')'; }
  window.addEventListener('resize', function () { if (grid) grid.forEach(function (row) { row.forEach(function (t) { t && paint(t); }); }); });
  var lastMv = 0, flash = 0;
  function move(dir) { // 0 left 1 up 2 right 3 down
    if (!G.running || busy || performance.now() - lastMv < 120) return; lastMv = performance.now(); var moved = false, gain = 0, merges = [];
    var vec = [[0, -1], [-1, 0], [0, 1], [1, 0]][dir], dr = vec[0], dc = vec[1];
    var rs = [0, 1, 2, 3], cs = [0, 1, 2, 3]; if (dr === 1) rs.reverse(); if (dc === 1) cs.reverse();
    var mergedFlag = {};
    rs.forEach(function (r) { cs.forEach(function (c) {
      var t = grid[r][c]; if (!t) return; var nr = r, nc = c;
      while (true) { var tr = nr + dr, tc = nc + dc; if (tr < 0 || tr >= N || tc < 0 || tc >= N) break; var o = grid[tr][tc];
        if (!o) { nr = tr; nc = tc; continue; }
        if (o.v === t.v && !mergedFlag[o.id]) { nr = tr; nc = tc; } break; }
      if (nr === r && nc === c) return; moved = true;
      var target = grid[nr][nc]; grid[r][c] = null;
      if (target) { mergedFlag[target.id] = true; t.r = nr; t.c = nc; t.el.style.transform = 'translate(' + nc * 114.3 + '%,' + nr * 114.3 + '%)'; t.el.style.zIndex = 1; merges.push([t, target]); gain += target.v * 2; }
      else { grid[nr][nc] = t; t.r = nr; t.c = nc; t.el.style.transform = 'translate(' + nc * 114.3 + '%,' + nr * 114.3 + '%)'; }
    }); });
    if (!moved) { NW.sfx.bad(); NW.vib(5); NW.shake(boardEl, 2, 180); return; }
    busy = true; NW.sfx.swap(); NW.vib(8); NW.shake(boardEl, 4, 160);
    setTimeout(function () {
      var best = 0;
      merges.forEach(function (m) { var a = m[0], b = m[1]; a.el.remove(); b.v *= 2; b.el.classList.remove('new'); b.el.classList.remove('merged'); void b.el.offsetWidth; b.el.classList.add('merged'); paint(b); best = Math.max(best, b.v);
        var bw = boardEl.clientWidth, x = (b.c + .5) * .256 * bw + bw * .028 * 0 + bw * .0, y = (b.r + .5) * .256 * bw; x += bw * 0.028; y += bw * 0.028;
        fx.burst(x, y, { count: 10 + Math.min(18, Math.log2(b.v) * 2), speed: 230, colors: [(COL[b.v] || COL[2048])[2], '#fff', '#FFD23F'], size: 6 }); fx.text(x, y - 10, '+' + b.v, { size: 22, color: '#ff8a00' }); });
      if (merges.length) { NW.sfx.merge(Math.min(8, Math.log2(best) - 1)); NW.vib(6 + Math.min(10, Math.log2(best))); flash = best >= 256 ? .8 : .32; if (merges.length > 1) { fx.text(ov.w / 2, ov.h * .4, merges.length + ' 连合！', { size: 34, color: '#ff4a2a' }); NW.sfx.combo(merges.length); } if (best >= 128) NW.shake(boardEl, 5, 220); }
      if (gain) G.setScore(G.score + gain);
      add(); busy = false;
      if (best >= 2048 && !won) { won = true; NW.sfx.win(); fx.burst(ov.w / 2, ov.h / 2, { count: 70, speed: 520, size: 12, life: 1.2 }); G.toast('合出 2048 了！继续冲更高'); }
      if (!canMove()) setTimeout(function () { G.over('没有可以合并的了，最大是 ' + maxTile()); }, 250);
    }, 125);
  }
  function maxTile() { var m = 0; grid.forEach(function (r) { r.forEach(function (t) { if (t) m = Math.max(m, t.v); }); }); return m; }
  function canMove() { if (empties().length) return true; for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) { var t = grid[r][c]; if (c < 3 && grid[r][c + 1].v === t.v) return true; if (r < 3 && grid[r + 1][c].v === t.v) return true; } return false; }
  var sx, sy, st = 0;
  document.addEventListener('pointerdown', function (e) { if (e.target.closest('.nw-modal,.nw-top,button,a')) return; sx = e.clientX; sy = e.clientY; st = 1; });
  document.addEventListener('pointerup', function (e) { if (!st) return; st = 0; var dx = e.clientX - sx, dy = e.clientY - sy; if (Math.max(Math.abs(dx), Math.abs(dy)) < 26) return; move(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 0 : 2) : (dy < 0 ? 1 : 3)); });
  document.addEventListener('keydown', function (e) { var k = { ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3 }[e.key]; if (k !== undefined) { e.preventDefault(); move(k); } });
  var last = performance.now(); (function loop(t) { var dt = Math.min(.05, (t - last) / 1000); last = t; if (flash > 0) flash = Math.max(0, flash - 2.2 * dt); fx.update(dt); var c = ov.ctx; c.setTransform(ov.dpr, 0, 0, ov.dpr, 0, 0); c.clearRect(0, 0, ov.w, ov.h); fx.draw(c); if (flash > 0) { c.globalAlpha = flash * .35; c.fillStyle = '#fff'; c.fillRect(0, 0, ov.w, ov.h); c.globalAlpha = 1; } requestAnimationFrame(loop); })(last);
  reset();
})();
</script>
</body>
</html>
